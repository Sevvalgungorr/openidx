name: openidx_client
description: OpenIDX native desktop client (Flutter shell over the local openidx-agent engine).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # Desktop shell: window chrome + system tray + open external URLs.
  window_manager: ^0.4.2
  tray_manager: ^0.3.2
  url_launcher: ^6.3.0

  # Platform paths (locating the bundled sidecar / runtime dir).
  path_provider: ^2.1.4

  # State management.
  flutter_riverpod: ^2.5.1

dev_dependencies:
  flutter_lints: ^4.0.0
  test: ^1.25.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
