name: client-mobile-release

# Publishes an installable Android APK of the Flutter client and attaches it to
# the GitHub Release for each version tag, giving a stable, login-free download
# URL (github.com/<repo>/releases/latest) instead of a login-gated, expiring
# Actions artifact. The APK is release-mode (Flutter's template signs the release
# build with the debug keystore, so it installs via sideload) — good for internal
# distribution; a Play-Store build still needs a real signing key + store upload.
#
# Trigger is tag-only (no paths filter, which would otherwise skip tag pushes
# whose commit didn't touch client/**). Also runnable on demand.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write # attach the APK to the release

env:
  FLUTTER_VERSION: "3.24.0"
  GO_VERSION: "1.25.x"
  NDK_VERSION: "26.1.10909125"

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;${{ env.NDK_VERSION }}"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: gomobile init
        run: gomobile init

      - name: Build engine.aar (gomobile bind)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: |
          mkdir -p client/plugins/openidx_engine/android/libs
          gomobile bind -target=android -o client/plugins/openidx_engine/android/libs/engine.aar ./agent/mobile

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Materialize platform runners
        working-directory: client
        run: flutter create --platforms=ios,android --project-name openidx_client .

      - name: Resolve dependencies
        working-directory: client
        run: flutter pub get

      - name: Build release APK
        working-directory: client
        run: flutter build apk --release

      - name: Rename APK with version
        run: |
          mkdir -p dist
          cp client/build/app/outputs/flutter-apk/app-release.apk \
             "dist/openidx-agent-android-${GITHUB_REF_NAME}.apk"
          # Also publish a stable, version-less name for "latest" links.
          cp client/build/app/outputs/flutter-apk/app-release.apk \
             dist/openidx-agent-android.apk
          ( cd dist && sha256sum *.apk > SHA256SUMS.txt )

      - name: Upload APK as a build artifact (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: openidx-android-apk-${{ github.ref_name }}
          path: dist/*.apk

      - name: Attach APK to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/openidx-agent-android-${{ github.ref_name }}.apk
            dist/openidx-agent-android.apk
            dist/SHA256SUMS.txt
