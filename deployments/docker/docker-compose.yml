  #---------------------------------------------------------------------------
  # OAuth/OIDC Service - OpenIDX Native OAuth Provider
  #---------------------------------------------------------------------------

  oauth-service:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.oauth-service
      network: host
    container_name: openidx-oauth-service
    restart: unless-stopped
    environment:
      - APP_ENV=development
      # Single-tenant install: attach the seeded default org when no tenant
      # subdomain/JWT signal is present, so org-scoped reads aren't empty under RLS.
      - DEFAULT_ORG_FALLBACK=${DEFAULT_ORG_FALLBACK:-true}
      - DEFAULT_ORG_ID=${DEFAULT_ORG_ID:-00000000-0000-0000-0000-000000000010}
      - DATABASE_URL=postgres://openidx_app:${OPENIDX_APP_PASSWORD:?OPENIDX_APP_PASSWORD required - run scripts/generate-secrets.sh}@postgres:5432/openidx?sslmode=${DATABASE_SSL_MODE:-disable}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required - run scripts/generate-secrets.sh}@redis:6379
      - LOG_LEVEL=debug
      - OPENIDX_ENABLE_RATE_LIMIT=false
      - TRACING_ENABLED=${TRACING_ENABLED:-false}
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
      - OTEL_SERVICE_NAME=oauth-service
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET required - run scripts/generate-secrets.sh}
      - OAUTH_ISSUER=https://oauth.localtest.me:8446
      - PORT=8006
    ports:
      - "8006:8006"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8006/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - openidx-network

  # Unified TLS reverse proxy for all *.localtest.me domains
  # Uses Docker DNS resolver with 10s TTL to avoid stale IP caching
  tls-proxy:
    image: nginx:alpine
    container_name: openidx-tls-proxy
    restart: unless-stopped
    volumes:
      - browzer_certs:/certs:ro
    ports:
      - "8446:8446"
      - "1280:1280"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf << 'NGINX'
        # OAuth/OIDC TLS termination (BrowZer needs HTTPS IdP)
        server {
            listen 8446 ssl;
            server_name oauth.localtest.me;
            ssl_certificate /certs/browzer-tls.crt;
            ssl_certificate_key /certs/browzer-tls.key;
            resolver 127.0.0.11 valid=10s;
            set $$oauth_upstream http://oauth-service:8006;
            location / {
                proxy_pass $$oauth_upstream;
                proxy_set_header Host $$host;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
            }
        }
        # Ziti Controller TLS re-termination (browser-trusted cert in front of self-signed)
        server {
            listen 1280 ssl;
            server_name ziti-controller.localtest.me;
            ssl_certificate /certs/browzer-tls.crt;
            ssl_certificate_key /certs/browzer-tls.key;
            resolver 127.0.0.11 valid=10s;
            set $$ziti_upstream https://ziti-controller:1280;
            location / {
                proxy_pass $$ziti_upstream;
                proxy_ssl_verify off;
                proxy_set_header Host $$host;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_read_timeout 300s;
                proxy_send_timeout 300s;
            }
        }
        NGINX
        nginx -g 'daemon off;'
    depends_on:
      oauth-service:
        condition: service_healthy
      ziti-controller:
        condition: service_healthy
      browzer-cert-init:
        condition: service_completed_successfully
    networks:
      openidx-network:
        aliases:
          - oauth.localtest.me
          - ziti-controller.localtest.me

  #---------------------------------------------------------------------------
  # OpenZiti Zero Trust Network Fabric
  #---------------------------------------------------------------------------

  ziti-controller:
    # Pinned: this codebase embeds sdk-golang v1.7.0, verified against
    # controller 1.6.12 (see docs/OPENIDX_ZITI_ARCHITECTURE.md §9 on version
    # skew). Bump this tag together with the SDK, not independently.
    image: openziti/ziti-controller:${ZITI_VERSION:-1.6.12}
    container_name: openidx-ziti-controller
    restart: unless-stopped
    environment:
      - ZITI_BOOTSTRAP=true
      # Serve the bundled ZAC admin console at https://ziti-controller.localtest.me:11280/zac/
      - ZITI_BOOTSTRAP_CONSOLE=true
      - ZITI_CTRL_ADVERTISED_ADDRESS=ziti-controller.localtest.me
      - ZITI_CTRL_ADVERTISED_PORT=1280
      - ZITI_PWD=${ZITI_PWD:?ZITI_PWD required - run scripts/generate-secrets.sh}
      - PFXLOG_NO_JSON=true
    volumes:
      - ziti_controller_data:/home/ziggy
      - ziti_controller_pki:/ziti-controller
      - browzer_certs:/browzer-certs:ro
    ports:
      - "11280:1280"
    healthcheck:
      test: ["CMD", "ziti", "agent", "stats"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      openidx-network:
        aliases:
          - ziti-controller.localtest.me

  ziti-router-init:
    image: openziti/ziti-controller:${ZITI_VERSION:-1.6.12}
    container_name: openidx-ziti-router-init
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        TOKEN_FILE=/ziti-shared/router.jwt
        if [ -f "$$TOKEN_FILE" ] && [ -s "$$TOKEN_FILE" ]; then
          echo "Router JWT already exists, skipping creation"
          exit 0
        fi
        echo "Logging in to Ziti controller..."
        ziti edge login ziti-controller.localtest.me:1280 -u admin -p "$${ZITI_PWD}" --yes
        echo "Creating edge router..."
        ziti edge create edge-router openidx-router --jwt-output-file "$$TOKEN_FILE" 2>/dev/null || \
          echo "Router may already exist, trying to fetch JWT..."
        if [ ! -f "$$TOKEN_FILE" ] || [ ! -s "$$TOKEN_FILE" ]; then
          ROUTER_ID=$$(ziti edge list edge-routers 'name="openidx-router"' -j 2>/dev/null | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          if [ -n "$$ROUTER_ID" ]; then
            echo "Re-creating router to get fresh JWT..."
            ziti edge delete edge-router "$$ROUTER_ID" 2>/dev/null || true
            ziti edge create edge-router openidx-router --jwt-output-file "$$TOKEN_FILE"
          fi
        fi
        if [ -f "$$TOKEN_FILE" ] && [ -s "$$TOKEN_FILE" ]; then
          chmod 644 "$$TOKEN_FILE"
          echo "Router JWT saved to $$TOKEN_FILE"
        else
          echo "ERROR: Could not obtain router JWT"
          exit 1
        fi
    environment:
      - ZITI_PWD=${ZITI_PWD:?ZITI_PWD required - run scripts/generate-secrets.sh}
    volumes:
      - ziti_router_shared:/ziti-shared
    depends_on:
      ziti-controller:
        condition: service_healthy
    networks:
      - openidx-network

  ziti-router:
    image: openziti/ziti-router:${ZITI_VERSION:-1.6.12}
    container_name: openidx-ziti-router
    restart: unless-stopped
    environment:
      - ZITI_BOOTSTRAP=true
      - ZITI_BOOTSTRAP_ENROLLMENT=true
      - ZITI_CTRL_ADVERTISED_ADDRESS=ziti-controller.localtest.me
      - ZITI_CTRL_ADVERTISED_PORT=1280
      - ZITI_ROUTER_ADVERTISED_ADDRESS=ziti-router
      - ZITI_ROUTER_PORT=3022
      - ZITI_ENROLL_TOKEN=/ziti-shared/router.jwt
    # Run from the version-controlled config + entrypoint in ./ziti-router/
    # (replaces the old generate-then-sed/awk-patch startup). The config is
    # copied into the volume on first start; the volume copy then wins.
    entrypoint: ["/bin/bash", "/openidx/entrypoint.bash"]
    volumes:
      - ./ziti-router/entrypoint.bash:/openidx/entrypoint.bash:ro
      - ./ziti-router/config.yml:/etc/ziti/router-config.yml:ro
      - ziti_router_data:/ziti-router
      - ziti_router_shared:/ziti-shared:ro
      - browzer_certs:/browzer-certs:ro
    ports:
      - "3022:3022"
      - "3023:3023"
    # Same IPC-based agent probe as the controller: proves the router process
    # is up and responsive (it previously ran with no healthcheck at all, so a
    # wedged router looked "Up" while the data plane was dead).
    healthcheck:
      test: ["CMD", "ziti", "agent", "stats"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      ziti-controller:
        condition: service_healthy
      ziti-router-init:
        condition: service_completed_successfully
      browzer-cert-init:
        condition: service_completed_successfully
    networks:
      - openidx-network

  # TLS proxy for Ziti router WSS — browsers trust the mkcert cert
  # ZBR SDK in browser connects here; proxy forwards WebSocket to router's WSS
  # NOTE: ziti-router-wss-proxy removed - router alt_server_certs handles TLS
  # Browser connects to browzer.localtest.me:3023 → router selects mkcert alt cert

  #---------------------------------------------------------------------------
  # BrowZer Bootstrapper - Browser-Native Ziti Access
  #---------------------------------------------------------------------------

  browzer-cert-init:
    image: openziti/ziti-controller:${ZITI_VERSION:-1.6.12}
    container_name: openidx-browzer-cert-init
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        echo "Extracting Ziti CA cert..."
        cat /ziti-pki/pki/root/certs/root.cert > /shared-certs/ziti-ca.pem
        chmod 644 /shared-certs/ziti-ca.pem
        echo "Generating wildcard TLS cert for *.localtest.me..."
        if [ ! -f /shared-certs/browzer-tls.key ] || ! openssl x509 -in /shared-certs/browzer-tls.crt -noout -text 2>/dev/null | grep -q '\*.localtest.me'; then
          openssl req -x509 -newkey rsa:2048 -keyout /shared-certs/browzer-tls.key \
            -out /shared-certs/browzer-tls.crt -days 365 -nodes \
            -subj "/CN=localtest.me" \
            -addext "subjectAltName=DNS:*.localtest.me,DNS:localtest.me,DNS:localhost,IP:127.0.0.1"
          chmod 644 /shared-certs/browzer-tls.key /shared-certs/browzer-tls.crt
          echo "TLS cert generated (wildcard)"
        else
          echo "TLS cert already exists with wildcard SAN"
        fi
        # Patch controller config to add alt_server_certs for browser-trusted TLS
        if [ -f /shared-certs/browzer-tls.crt ] && [ -f /ziti-pki/config.yml ]; then
          if ! grep -q "alt_server_certs:" /ziti-pki/config.yml; then
            sed -i 's|#alt_server_certs:|alt_server_certs:|; s|#  - server_cert:  ""|  - server_cert: "/browzer-certs/browzer-tls.crt"|; s|#    server_key:   ""|    server_key: "/browzer-certs/browzer-tls.key"|' /ziti-pki/config.yml
            echo "Patched controller config with alt_server_certs"
          else
            echo "Controller config already has alt_server_certs"
          fi
        fi
        echo "Cert init complete"
    volumes:
      - ziti_controller_pki:/ziti-pki
      - browzer_certs:/shared-certs
    depends_on:
      ziti-controller:
        condition: service_healthy
    networks:
      - openidx-network

  browzer-bootstrapper:
    image: ghcr.io/openziti/ziti-browzer-bootstrapper:latest
    container_name: openidx-browzer-bootstrapper
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/browzer-entrypoint.sh"]
    environment:
      - ZITI_BROWZER_BOOTSTRAPPER_LOGLEVEL=debug
      - ZITI_BROWZER_BOOTSTRAPPER_HOST=browzer.localtest.me
      - ZITI_BROWZER_BOOTSTRAPPER_LISTEN_PORT=443
      - ZITI_BROWZER_BOOTSTRAPPER_SCHEME=https
      - ZITI_BROWZER_BOOTSTRAPPER_CERTIFICATE_PATH=/shared-certs/browzer-tls.crt
      - ZITI_BROWZER_BOOTSTRAPPER_KEY_PATH=/shared-certs/browzer-tls.key
      - ZITI_BROWZER_RUNTIME_LOGLEVEL=debug
      - ZITI_BROWZER_RUNTIME_HOTKEY=alt+F12
      - ZITI_CONTROLLER_HOST=ziti-controller.localtest.me
      - ZITI_CONTROLLER_PORT=1280
      # Targets loaded from /shared-config/config.json (generated by access-service)
      # Single router target: all path-based services go through browzer-router-zt
      - ZITI_BROWZER_OIDC_URL=http://oauth-service:8006
      - NODE_EXTRA_CA_CERTS=/shared-certs/mkcert-rootCA.pem
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    volumes:
      - browzer_certs:/shared-certs
      - browzer_config:/shared-config
      - ./browzer-entrypoint.sh:/browzer-entrypoint.sh:ro
    ports:
      - "443:443"
    depends_on:
      ziti-controller:
        condition: service_healthy
      oauth-service:
        condition: service_healthy
      browzer-cert-init:
        condition: service_completed_successfully
    networks:
      openidx-network:
        aliases:
          - browzer.localtest.me

  # BrowZer path-based router — dispatches paths to backends inside Ziti tunnel
  browzer-router:
    image: nginx:alpine
    container_name: openidx-browzer-router
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/browzer-router-entrypoint.sh"]
    volumes:
      - browzer_config:/shared-config
      - ./browzer-router-entrypoint.sh:/browzer-router-entrypoint.sh:ro
    depends_on:
      - demo-app
      - guacamole-zbr-proxy
    networks:
      - openidx-network

  #---------------------------------------------------------------------------
  # Demo App - Identity-aware app showcasing OpenIDX SSO + BrowZer access
  #---------------------------------------------------------------------------

  demo-app:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.demo-app
      network: host
    container_name: openidx-demo-app
    restart: unless-stopped
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8090/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - openidx-network

  #---------------------------------------------------------------------------
  # Simple Web - Lightweight static web service (BrowZer target)
  #---------------------------------------------------------------------------

  simple-web:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.simple-web
      network: host
    container_name: openidx-simple-web
    restart: unless-stopped
    ports:
      - "8091:8091"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8091/ || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - openidx-network

  #---------------------------------------------------------------------------
  # Apache Guacamole - Clientless Remote Desktop Gateway
  #---------------------------------------------------------------------------

  guacd:
    image: guacamole/guacd:latest
    container_name: openidx-guacd
    restart: unless-stopped
    networks:
      - openidx-network

  guacamole:
    image: guacamole/guacamole:latest
    container_name: openidx-guacamole
    restart: unless-stopped
    entrypoint: /bin/bash
    command:
      - -c
      - |
        # Run all entrypoint scripts EXCEPT the Tomcat starter
        for SCRIPT in /opt/guacamole/entrypoint.d/*.sh; do
          [ "$$(basename "$$SCRIPT")" = "999-start-tomcat.sh" ] && continue
          source "$$SCRIPT"
        done
        # Disable WebSocket tunnel — ZBR does NOT route WebSocket through Ziti
        # (confirmed: zero WS requests reach server). Force HTTP tunnel.
        echo "enable-websocket: false" >> "$$GUACAMOLE_HOME/guacamole.properties"
        # Start Tomcat (replaces process via exec)
        source /opt/guacamole/entrypoint.d/999-start-tomcat.sh
    environment:
      - GUACD_HOSTNAME=guacd
      - POSTGRESQL_HOSTNAME=postgres
      - POSTGRESQL_DATABASE=guacamole
      - POSTGRESQL_USER=openidx
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required - run scripts/generate-secrets.sh}
      - POSTGRESQL_AUTO_CREATE_ACCOUNTS=true
    depends_on:
      - guacd
      - postgres
    ports:
      - "8085:8080"
    networks:
      - openidx-network

  # BrowZer-aware reverse proxy for Guacamole
  #
  # Key insight: fetch() + response.body.getReader() DOES stream through
  # Service Workers (Chrome 52+), unlike XHR readyState 3 which is fundamentally
  # broken (W3C ServiceWorker Issue #1141). ZBR's SW already creates
  # ReadableStream-backed Response objects for non-HTML content.
  #
  # Solution: Inject a custom Guacamole tunnel that uses the Fetch API with
  # ReadableStream instead of XHR. Reads stream incrementally through ZBR's SW.
  # No more buffering. No more IOException→tunnel death. Simple proxy with
  # long timeouts — the streaming just works.
  guacamole-zbr-proxy:
    image: nginx:alpine
    container_name: openidx-guacamole-zbr-proxy
    restart: unless-stopped
    entrypoint: /bin/sh
    command:
      - -c
      - |
        # Write the fetch-based tunnel JavaScript to a file (avoids YAML escaping issues)
        cat > /usr/share/nginx/html/browzer-tunnel.js << 'JSEOF'
        (function(){
          if(!window.Guacamole)return;
          /* Disable WebSocket tunnel - ZBR does not route WS through Ziti */
          Guacamole.WebSocketTunnel=function(){
            Guacamole.Tunnel.call(this);
            var t=this;
            this.connect=function(){setTimeout(function(){
              if(t.onerror)t.onerror(new Guacamole.Status(Guacamole.Status.Code.UPSTREAM_NOT_FOUND,"WebSocket disabled"));
            },0)};
            this.disconnect=function(){};
            this.sendMessage=function(){};
          };
          Guacamole.WebSocketTunnel.prototype=new Guacamole.Tunnel();

          /* Override HTTPTunnel to use fetch() + ReadableStream instead of XHR.
           * XHR readyState 3 never fires through Service Workers (W3C Issue #1141).
           * fetch() + response.body.getReader() DOES stream through SWs (Chrome 52+). */
          Guacamole.HTTPTunnel=function(tunnelURL,crossDomain,extraTunnelHeaders){
            Guacamole.Tunnel.call(this);
            var tunnel=this;
            var CONNECT=tunnelURL+"?connect";
            var READ=tunnelURL+"?read:";
            var WRITE=tunnelURL+"?write:";
            var uuid=null;
            var readRequestId=0;
            var writeRequestId=0;
            var tunnelToken=null;
            var abortController=null;
            var decoder=new TextDecoder();
            var parseBuffer="";

            function fireInstruction(opcode,args){
              if(opcode===Guacamole.Tunnel.INTERNAL_DATA_OPCODE)return;
              if(tunnel.oninstruction)tunnel.oninstruction(opcode,args);
            }

            function parseInstructions(text){
              parseBuffer+=text;
              var pos=0;
              while(pos<parseBuffer.length){
                var elemStart=pos;
                var elements=[];
                var complete=false;
                while(elemStart<parseBuffer.length){
                  var dotPos=parseBuffer.indexOf(".",elemStart);
                  if(dotPos<0)break;
                  var len=parseInt(parseBuffer.substring(elemStart,dotPos),10);
                  if(isNaN(len))break;
                  var valStart=dotPos+1;
                  var valEnd=valStart+len;
                  if(valEnd>parseBuffer.length)break;
                  elements.push(parseBuffer.substring(valStart,valEnd));
                  var delim=parseBuffer.charAt(valEnd);
                  if(delim===";"){complete=true;elemStart=valEnd+1;break;}
                  else if(delim===","){elemStart=valEnd+1;}
                  else break;
                }
                if(!complete)break;
                pos=elemStart;
                if(elements.length>0)fireInstruction(elements[0],elements.slice(1));
              }
              parseBuffer=parseBuffer.substring(pos);
            }

            function startRead(){
              if(tunnel.state!==Guacamole.Tunnel.State.OPEN)return;
              var reqId=readRequestId++;
              var url=READ+uuid+":"+reqId;
              abortController=new AbortController();
              var headers={};
              if(tunnelToken)headers["Guacamole-Tunnel-Token"]=tunnelToken;
              fetch(url,{signal:abortController.signal,headers:headers,credentials:crossDomain?"include":"same-origin"})
              .then(function(response){
                if(response.status!==200){
                  tunnel.state=Guacamole.Tunnel.State.CLOSED;
                  if(tunnel.onstatechange)tunnel.onstatechange(tunnel.state);
                  if(tunnel.onerror)tunnel.onerror(new Guacamole.Status(
                    Guacamole.Status.Code.fromHTTPStatusCode(response.status),response.statusText));
                  return;
                }
                var newToken=response.headers.get("Guacamole-Tunnel-Token");
                if(newToken)tunnelToken=newToken;
                var reader=response.body.getReader();
                function pump(){
                  return reader.read().then(function(result){
                    if(result.done){startRead();return;}
                    var chunk=decoder.decode(result.value,{stream:true});
                    parseInstructions(chunk);
                    return pump();
                  });
                }
                return pump();
              })
              .catch(function(err){
                if(err.name==="AbortError")return;
                console.error("[FetchTunnel] read error:",err);
                if(tunnel.state===Guacamole.Tunnel.State.OPEN){
                  tunnel.state=Guacamole.Tunnel.State.CLOSED;
                  if(tunnel.onstatechange)tunnel.onstatechange(tunnel.state);
                  if(tunnel.onerror)tunnel.onerror(new Guacamole.Status(
                    Guacamole.Status.Code.SERVER_ERROR,err.message));
                }
              });
            }

            this.sendMessage=function(){
              var msg="";
              for(var i=0;i<arguments.length;i++){
                var v=String(arguments[i]);
                msg+=v.length+"."+v;
                msg+=(i<arguments.length-1)?",":";";
              }
              var url=WRITE+uuid+":"+(writeRequestId++);
              var headers={"Content-Type":"application/octet-stream"};
              if(tunnelToken)headers["Guacamole-Tunnel-Token"]=tunnelToken;
              fetch(url,{method:"POST",headers:headers,body:msg,
                credentials:crossDomain?"include":"same-origin"});
            };

            this.connect=function(data){
              tunnel.state=Guacamole.Tunnel.State.CONNECTING;
              if(tunnel.onstatechange)tunnel.onstatechange(tunnel.state);
              fetch(CONNECT,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
                body:data,credentials:crossDomain?"include":"same-origin"})
              .then(function(response){
                if(response.status!==200){
                  tunnel.state=Guacamole.Tunnel.State.CLOSED;
                  if(tunnel.onstatechange)tunnel.onstatechange(tunnel.state);
                  if(tunnel.onerror)tunnel.onerror(new Guacamole.Status(
                    Guacamole.Status.Code.fromHTTPStatusCode(response.status)));
                  return;
                }
                tunnelToken=response.headers.get("Guacamole-Tunnel-Token");
                return response.text();
              })
              .then(function(body){
                if(!body)return;
                uuid=body;
                tunnel.uuid=uuid;
                tunnel.state=Guacamole.Tunnel.State.OPEN;
                if(tunnel.onstatechange)tunnel.onstatechange(tunnel.state);
                startRead();
              })
              .catch(function(err){
                tunnel.state=Guacamole.Tunnel.State.CLOSED;
                if(tunnel.onstatechange)tunnel.onstatechange(tunnel.state);
                if(tunnel.onerror)tunnel.onerror(new Guacamole.Status(
                  Guacamole.Status.Code.SERVER_ERROR,err.message));
              });
            };

            this.disconnect=function(){
              if(abortController)abortController.abort();
              tunnel.state=Guacamole.Tunnel.State.CLOSED;
              if(tunnel.onstatechange)tunnel.onstatechange(tunnel.state);
            };
          };
          Guacamole.HTTPTunnel.prototype=new Guacamole.Tunnel();
          console.log("[BrowZer] Fetch-based streaming HTTP tunnel injected");
        })();
        JSEOF

        cat > /etc/nginx/nginx.conf << 'NGINX'
        events {
            worker_connections 1024;
        }

        error_log /dev/stderr warn;

        http {
            include /etc/nginx/mime.types;

            server {
                listen 80;
                server_name _;

                # Serve the injected tunnel JS
                location = /guacamole/browzer-tunnel.js {
                    alias /usr/share/nginx/html/browzer-tunnel.js;
                    add_header Content-Type application/javascript;
                    add_header Cache-Control "no-cache";
                }

                # HTTP tunnel — simple proxy with long timeouts
                location /guacamole/tunnel {
                    proxy_pass http://guacamole:8080;
                    proxy_http_version 1.1;
                    proxy_set_header Host $$host;
                    proxy_set_header X-Real-IP $$remote_addr;
                    proxy_set_header Connection "";
                    proxy_read_timeout 86400s;
                    proxy_send_timeout 86400s;
                    proxy_buffering off;
                    proxy_request_buffering off;
                    proxy_cache off;
                    access_log /dev/stderr;
                }

                # Let blank.html through to Guacamole (viewport template)
                location = /guacamole/app/element/templates/blank.html {
                    proxy_pass http://guacamole:8080;
                    proxy_set_header Host $$host;
                    proxy_set_header Accept-Encoding "";
                }

                # All other Guacamole requests
                location / {
                    proxy_pass http://guacamole:8080;
                    proxy_http_version 1.1;
                    proxy_set_header Host $$host;
                    proxy_set_header X-Real-IP $$remote_addr;
                    proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $$scheme;
                    proxy_set_header Accept-Encoding "";
                    add_header Service-Worker-Allowed "/" always;
                    proxy_read_timeout 300s;

                    # Inject script tag for the fetch-based tunnel
                    sub_filter_types text/html;
                    sub_filter_once on;
                    sub_filter '</body>' '<script src="/guacamole/browzer-tunnel.js"></script></body>';
                }
            }
        }
        NGINX
        nginx -g 'daemon off;' -c /etc/nginx/nginx.conf
    depends_on:
      - guacamole
    networks:
      - openidx-network

  #---------------------------------------------------------------------------
  # Zero Trust Access Proxy Service
  #---------------------------------------------------------------------------

  access-service:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.access-service
      network: host
    container_name: openidx-access-service
    restart: unless-stopped
    environment:
      - APP_ENV=development
      # Single-tenant install: attach the seeded default org when no tenant
      # subdomain/JWT signal is present, so org-scoped reads aren't empty under RLS.
      - DEFAULT_ORG_FALLBACK=${DEFAULT_ORG_FALLBACK:-true}
      - DEFAULT_ORG_ID=${DEFAULT_ORG_ID:-00000000-0000-0000-0000-000000000010}
      - DATABASE_URL=postgres://openidx_app:${OPENIDX_APP_PASSWORD:?OPENIDX_APP_PASSWORD required - run scripts/generate-secrets.sh}@postgres:5432/openidx?sslmode=${DATABASE_SSL_MODE:-disable}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required - run scripts/generate-secrets.sh}@redis:6379
      - OAUTH_ISSUER=https://oauth.localtest.me:8446
      - OAUTH_JWKS_URL=http://oauth-service:8006/.well-known/jwks.json
      - GOVERNANCE_URL=http://governance-service:8002
      - AUDIT_URL=http://audit-service:8004
      - ACCESS_SESSION_SECRET=${ACCESS_SESSION_SECRET:?ACCESS_SESSION_SECRET required - run scripts/generate-secrets.sh}
      - ACCESS_PROXY_DOMAIN=localhost
      - ZITI_ENABLED=${ZITI_ENABLED:-true}
      - ZITI_CTRL_URL=https://ziti-controller.localtest.me:1280
      - ZITI_ADMIN_USER=admin
      - ZITI_ADMIN_PASSWORD=${ZITI_PWD:?ZITI_PWD required - run scripts/generate-secrets.sh}
      - ZITI_IDENTITY_DIR=/ziti
      # Browser-facing ZAC console URL (host port 11280 maps to controller 1280)
      - ZITI_CONSOLE_URL=https://ziti-controller.localtest.me:11280/zac/
      - GUACAMOLE_URL=http://guacamole:8080/guacamole
      - GUACAMOLE_ADMIN_USER=guacadmin
      - GUACAMOLE_ADMIN_PASSWORD=${GUACAMOLE_ADMIN_PASSWORD:?GUACAMOLE_ADMIN_PASSWORD required - run scripts/generate-secrets.sh}
      - CONTINUOUS_VERIFY_ENABLED=${CONTINUOUS_VERIFY_ENABLED:-true}
      - CONTINUOUS_VERIFY_INTERVAL=${CONTINUOUS_VERIFY_INTERVAL:-30}
      - BROWZER_ENABLED=${BROWZER_ENABLED:-true}
      - BROWZER_CLIENT_ID=${BROWZER_CLIENT_ID:-browzer-client}
      - BROWZER_TARGETS_PATH=/shared-config/config.json
      - BROWZER_ROUTER_CONFIG_PATH=/shared-config/browzer-router.conf
      - BROWZER_CERTS_PATH=/shared-certs
      - APISIX_CONFIG_PATH=/apisix-conf/apisix.yaml
      - LOG_LEVEL=debug
      - OPENIDX_ENABLE_RATE_LIMIT=false
      - TRACING_ENABLED=${TRACING_ENABLED:-false}
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
      - OTEL_SERVICE_NAME=access-service
    volumes:
      - ziti_access_proxy:/ziti
      - browzer_config:/shared-config
      - browzer_certs:/shared-certs
      - apisix_config:/apisix-conf
    ports:
      - "8007:8007"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      oauth-service:
        condition: service_healthy
      ziti-controller:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8007/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    networks:
      - openidx-network

  #---------------------------------------------------------------------------
  # Admin Console - React Frontend
  #---------------------------------------------------------------------------
  
  admin-console:
    build:
      context: ../../web/admin-console
      dockerfile: ../../deployments/docker/Dockerfile.admin-console
      network: host
      args:
        - SRC_DIR=.
        - VITE_API_URL=http://openidx.tdv.org:8088
        - VITE_OAUTH_URL=http://openidx.tdv.org:8006
        - VITE_OAUTH_CLIENT_ID=admin-console
        - VITE_AUTH_PROVIDER=openidx
    container_name: openidx-admin-console
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://openidx.tdv.org:8088
      - VITE_OAUTH_URL=http://openidx.tdv.org:8006
      - VITE_OAUTH_CLIENT_ID=admin-console
      - VITE_AUTH_PROVIDER=openidx
    ports:
      - "3000:8080"
    depends_on:
      - admin-api
      - oauth-service
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - openidx-network

  #---------------------------------------------------------------------------
  # Mailpit - Local SMTP server for development email testing
  #---------------------------------------------------------------------------

  mailpit:
    image: axllent/mailpit:latest
    container_name: openidx-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=true
      - MP_SMTP_AUTH_ALLOW_INSECURE=true
    networks:
      - openidx-network

  #---------------------------------------------------------------------------
  # Observability: metrics (Prometheus/Alertmanager/Grafana), logs
  # (Loki/Promtail), traces (Jaeger). Each service exposes /metrics and
  # ships OTLP traces to jaeger:4317 (set TRACING_ENABLED=true to enable).
  # Configs live under deployments/docker/{prometheus,alertmanager,grafana,promtail}.
  #---------------------------------------------------------------------------

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: openidx-alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - openidx-network

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: openidx-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    depends_on:
      - alertmanager
    networks:
      - openidx-network

  grafana:
    image: grafana/grafana:10.3.1
    container_name: openidx-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - openidx-network

  loki:
    image: grafana/loki:2.9.4
    container_name: openidx-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    networks:
      - openidx-network

  promtail:
    image: grafana/promtail:2.9.4
    container_name: openidx-promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - openidx-network

  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: openidx-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    networks:
      - openidx-network

#---------------------------------------------------------------------------
# Networks
#---------------------------------------------------------------------------

  #---------------------------------------------------------------------------
  # Optional open-source companions (opt-in via --profile)
  #---------------------------------------------------------------------------

  # Self-hosted push notifications (--profile ntfy). Wire the app with
  # NTFY_BASE_URL=http://ntfy (+ NTFY_TOPIC_SECRET) to enable the push channel;
  # clients fetch their private topic from /api/v1/notifications/push-config.
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: openidx-ntfy
    restart: unless-stopped
    profiles:
      - ntfy
    command: ["serve", "--cache-file", "/var/cache/ntfy/cache.db"]
    volumes:
      - ntfy_cache:/var/cache/ntfy
    ports:
      - "8098:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O - http://localhost:80/v1/health | grep -o '\"healthy\":true' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    networks:
      - openidx-network

  # OpenBao KEK source (--profile openbao). Dev-mode server for local testing
  # of the BAO_* KEK flow — production runs a real, TLS-terminated OpenBao.
  # Seed the KEK once:  bao kv put secret/openidx/vault-kek kek=<base64-32B>
  openbao:
    image: openbao/openbao:latest
    container_name: openidx-openbao
    restart: unless-stopped
    profiles:
      - openbao
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      - BAO_DEV_ROOT_TOKEN_ID=${BAO_DEV_ROOT_TOKEN:-openbao-dev-root}
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    networks:
      - openidx-network

networks:
  openidx-network:
    driver: bridge

#---------------------------------------------------------------------------
# Volumes
#---------------------------------------------------------------------------

volumes:
  ntfy_cache:
  postgres_data:
  redis_data:
  elasticsearch_data:
  etcd_data:
  ziti_controller_data:
  ziti_controller_pki:
  ziti_router_data:
  ziti_router_shared:
  ziti_access_proxy:
  browzer_certs:
  browzer_config:
  apisix_config:
  prometheus_data:
  grafana_data:
  loki_data:
