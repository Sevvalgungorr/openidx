version: '3.9'

services:
  #---------------------------------------------------------------------------
  # Infrastructure Services
  #---------------------------------------------------------------------------
  
  postgres:
    image: postgres:16-alpine
    container_name: openidx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: openidx
      POSTGRES_USER: openidx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required - run scripts/generate-secrets.sh}
      OPENIDX_APP_PASSWORD: ${OPENIDX_APP_PASSWORD:?OPENIDX_APP_PASSWORD required - run scripts/generate-secrets.sh}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./bootstrap.sql:/docker-entrypoint-initdb.d/00-bootstrap.sql:ro
      - ./init-guacamole.sh:/docker-entrypoint-initdb.d/00-init-guacamole.sh:ro
      - ./init-guacamole.sql:/docker-entrypoint-initdb.d/guacamole-schema.sql:ro
      - ./set-app-role-password.sh:/docker-entrypoint-initdb.d/zz-set-app-role-password.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openidx"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openidx-network

  migrate:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.service
      args:
        SERVICE_NAME: migrate
    container_name: openidx-migrate
    command: ["up"]
    environment:
      - DATABASE_URL=postgres://openidx:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required - run scripts/generate-secrets.sh}@postgres:5432/openidx?sslmode=${DATABASE_SSL_MODE:-disable}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true
    networks:
      - openidx-network

  seed:
    image: postgres:16-alpine
    container_name: openidx-seed
    entrypoint: ["sh", "-c", "psql \"$$DATABASE_URL\" -v ON_ERROR_STOP=1 -f /seed/seed.sql"]
    environment:
      - DATABASE_URL=postgres://openidx:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required - run scripts/generate-secrets.sh}@postgres:5432/openidx?sslmode=${DATABASE_SSL_MODE:-disable}
    volumes:
      - ./seed.sql:/seed/seed.sql:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    healthcheck:
      disable: true
    networks:
      - openidx-network

  redis:
    image: redis:7-alpine
    container_name: openidx-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required - run scripts/generate-secrets.sh}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openidx-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: openidx-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'status'"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - openidx-network

  #---------------------------------------------------------------------------
  # API Gateway - Apache APISIX
  #---------------------------------------------------------------------------
  
  apisix-config-init:
    image: alpine:3.19
    container_name: openidx-apisix-config-init
    entrypoint: /bin/sh
    command:
      - -c
      - |
        if [ ! -f /apisix-conf/apisix.yaml ]; then
          cp /apisix-seed/apisix.yaml /apisix-conf/apisix.yaml
          echo "Seeded apisix.yaml into shared volume"
        else
          echo "apisix.yaml already exists in shared volume"
        fi
        chown 100:101 /apisix-conf
        chown 100:101 /apisix-conf/apisix.yaml
        chmod 775 /apisix-conf
        chmod 664 /apisix-conf/apisix.yaml
    volumes:
      - ./apisix/apisix.yaml:/apisix-seed/apisix.yaml:ro
      - apisix_config:/apisix-conf
    networks:
      - openidx-network

  apisix:
    image: apache/apisix:3.8.0-debian
    container_name: openidx-apisix
    restart: unless-stopped
    environment:
      # APISIX resolves ${{APISIX_ADMIN_KEY}} in config.yaml from this container env.
      - APISIX_ADMIN_KEY=${APISIX_ADMIN_KEY:?APISIX_ADMIN_KEY required - run scripts/generate-secrets.sh}
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix-wrapper.sh:/usr/local/bin/apisix-wrapper.sh:ro
      - apisix_config:/apisix-conf
    entrypoint: ["/bin/sh", "/usr/local/bin/apisix-wrapper.sh"]
    ports:
      - "8088:9080"
      - "8443:9443"
      - "9188:9180"
    depends_on:
      apisix-config-init:
        condition: service_completed_successfully
      etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9080'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openidx-network

  etcd:
    image: quay.io/coreos/etcd:v3.5.12
    container_name: openidx-etcd
    restart: unless-stopped
    command:
      - /usr/local/bin/etcd
      - --data-dir=/etcd-data
      - --name=etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    volumes:
      - etcd_data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://localhost:2379"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - openidx-network

  #---------------------------------------------------------------------------
  # Policy Engine - Open Policy Agent
  #---------------------------------------------------------------------------
  
  opa:
    image: openpolicyagent/opa:0.61.0
    container_name: openidx-opa
    restart: unless-stopped
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8281"
      - "--log-level=info"
      - "/policies"
    volumes:
      - ./opa/policies:/policies:ro
    ports:
      - "8281:8281"
    healthcheck:
      test: ["NONE"]
    networks:
      - openidx-network

  #---------------------------------------------------------------------------
  # OpenIDX Services
  #---------------------------------------------------------------------------
  
  identity-service:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.identity-service
      network: host
    container_name: openidx-identity-service
    restart: unless-stopped
    environment:
      - APP_ENV=development
      # Single-tenant install: attach the seeded default org when no tenant
      # subdomain/JWT signal is present, so org-scoped reads aren't empty under RLS.
      - DEFAULT_ORG_FALLBACK=${DEFAULT_ORG_FALLBACK:-true}
      - DEFAULT_ORG_ID=${DEFAULT_ORG_ID:-00000000-0000-0000-0000-000000000010}
      - DATABASE_URL=postgres://openidx_app:${OPENIDX_APP_PASSWORD:?OPENIDX_APP_PASSWORD required - run scripts/generate-secrets.sh}@postgres:5432/openidx?sslmode=${DATABASE_SSL_MODE:-disable}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required - run scripts/generate-secrets.sh}@redis:6379
      - OPA_URL=http://opa:8281
      - OAUTH_ISSUER=https://oauth.localtest.me:8446
      - OAUTH_JWKS_URL=http://oauth-service:8006/.well-known/jwks.json
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_FROM=noreply@openidx.local
      - LOG_LEVEL=debug
      - OPENIDX_ENABLE_RATE_LIMIT=false
      - TRACING_ENABLED=${TRACING_ENABLED:-false}
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
      - OTEL_SERVICE_NAME=identity-service
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - openidx-network

