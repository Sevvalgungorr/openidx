# oidx-nginx: reduced to the admin-console SPA static upstream behind APISIX.
# APISIX (:443) terminates TLS and routes every host natively; only
# openidx.tdv.org /* (SPA + assets) falls through to this server on :8443.
events {}
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  client_max_body_size 25m;

  # websocket upgrade helper (Guacamole tunnel at /guacamole/websocket-tunnel)
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 8443 ssl;
    server_name openidx.tdv.org localhost;
    ssl_certificate     /etc/nginx/tdv-fullchain.pem;
    ssl_certificate_key /etc/nginx/tdv-key.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers for the SPA + static assets. These responses are served
    # by nginx (not the Go services), so they bypassed the app's security-header
    # middleware and shipped with none. A ZAP scan flagged missing HSTS / CSP /
    # X-Frame-Options / X-Content-Type-Options on the site root. add_header with
    # `always` applies to error responses too. The CSP mirrors the app's policy
    # (self + inline styles for the bundler, data: images).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # PAM OpenZiti session broker (dedicated Guacamole @127.0.0.1:10091 whose
    # guacd rides the overlay). Separate context path so its auth tokens (minted
    # against THIS broker) aren't sent to the direct broker on /guacamole, which
    # would show a login screen. The upstream Guacamole still serves under its
    # own /guacamole app context, so we rewrite the path back to /guacamole/.
    location /guacamole-ziti/ {
      # Guacamole ships AngularJS 1.8.3, which compiles $parse expressions with
      # the Function constructor. Under the site-wide `script-src 'self'` the
      # browser refuses that compile and the console renders a BLANK page --
      # measured in headless Chrome against this broker on 2026-08-14, varying
      # only this header: shipped policy -> 4 EvalError + empty body;
      # + 'unsafe-eval' -> 0 EvalError + rendered page.
      #
      # 'unsafe-eval' is the ONLY relaxation: 'unsafe-inline' was measured
      # unnecessary, and frame-ancestors stays 'none' because the console is
      # launched with window.open, never framed.
      #
      # nginx add_header does not merge: ANY add_header here replaces the whole
      # inherited set (verified with a probe container -- a child location with
      # one add_header dropped the parent's X-Test-A entirely). So the other
      # security headers are repeated verbatim; deleting one silently drops it.
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
      add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
      proxy_pass http://127.0.0.1:10091/guacamole/;
      proxy_buffering off;
      proxy_http_version 1.1;
      proxy_set_header Host              $http_host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
      access_log off;
    }

    # PAM direct session broker (OpenIDX-owned Guacamole @127.0.0.1:10090).
    # Kept on the /guacamole context path the app expects so its absolute asset
    # and websocket-tunnel paths resolve through the proxy. Added 2026-07-12.
    location /guacamole/ {
      # Guacamole ships AngularJS 1.8.3, which compiles $parse expressions with
      # the Function constructor. Under the site-wide `script-src 'self'` the
      # browser refuses that compile and the console renders a BLANK page --
      # measured in headless Chrome against this broker on 2026-08-14, varying
      # only this header: shipped policy -> 4 EvalError + empty body;
      # + 'unsafe-eval' -> 0 EvalError + rendered page.
      #
      # 'unsafe-eval' is the ONLY relaxation: 'unsafe-inline' was measured
      # unnecessary, and frame-ancestors stays 'none' because the console is
      # launched with window.open, never framed.
      #
      # nginx add_header does not merge: ANY add_header here replaces the whole
      # inherited set (verified with a probe container -- a child location with
      # one add_header dropped the parent's X-Test-A entirely). So the other
      # security headers are repeated verbatim; deleting one silently drops it.
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
      add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
      proxy_pass http://127.0.0.1:10090/guacamole/;
      proxy_buffering off;
      proxy_http_version 1.1;
      proxy_set_header Host              $http_host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
      access_log off;
    }

    # SPA client-side routing fallback
    location / { try_files $uri $uri/ /index.html; }
  }
}
