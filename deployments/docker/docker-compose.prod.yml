# OpenIDX Production Docker Compose Configuration
# Domain: openidx.tdv.org
# This file extends the base docker-compose.yml with production-specific overrides
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: '3.9'

services:
  #---------------------------------------------------------------------------
  # Infrastructure Services - Production Overrides
  #---------------------------------------------------------------------------

  pg-certgen:
    image: alpine:3.20
    container_name: openidx-pg-certgen
    entrypoint: ["sh", "/certgen/pg-certgen.sh"]
    volumes:
      - ./pg-certgen.sh:/certgen/pg-certgen.sh:ro
      - pg_certs:/certs
    restart: "no"
    networks:
      - openidx-network

  postgres:
    restart: always
    depends_on:
      pg-certgen:
        condition: service_completed_successfully
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/certs/server.crt", "-c", "ssl_key_file=/certs/server.key"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required - see .env.production}
      OPENIDX_APP_PASSWORD: ${OPENIDX_APP_PASSWORD:?OPENIDX_APP_PASSWORD required - run scripts/generate-secrets.sh}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - pg_certs:/certs:ro
      - ./bootstrap.sql:/docker-entrypoint-initdb.d/00-bootstrap.sql:ro
      - ./init-guacamole.sh:/docker-entrypoint-initdb.d/00-init-guacamole.sh:ro
      - ./init-guacamole.sql:/docker-entrypoint-initdb.d/guacamole-schema.sql:ro
      - ./set-app-role-password.sh:/docker-entrypoint-initdb.d/zz-set-app-role-password.sh:ro
      - ${POSTGRES_BACKUP_PATH:-./backups/postgres}:/backups
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.service
      args:
        SERVICE_NAME: migrate
    container_name: openidx-migrate
    command: ["up"]
    environment:
      - DATABASE_URL=postgres://openidx:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/openidx?sslmode=${DATABASE_SSL_MODE:-require}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true
    networks:
      - openidx-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  seed:
    image: postgres:16-alpine
    container_name: openidx-seed
    entrypoint: ["sh", "-c", "psql \"$$DATABASE_URL\" -v ON_ERROR_STOP=1 -f /seed/seed.sql"]
    environment:
      - DATABASE_URL=postgres://openidx:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/openidx?sslmode=${DATABASE_SSL_MODE:-require}
    volumes:
      - ./seed.sql:/seed/seed.sql:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    healthcheck:
      disable: true
    networks:
      - openidx-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required - see .env.production} --maxmemory 512mb --maxmemory-policy allkeys-lru --save 900 1 --save 300 10
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  elasticsearch:
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?ELASTIC_PASSWORD required - run scripts/generate-secrets.sh}
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  #---------------------------------------------------------------------------
  # API Gateway - Production Configuration
  #---------------------------------------------------------------------------

  apisix:
    restart: always
    ports:
      - "80:9080"
      - "443:9443"
      - "127.0.0.1:9188:9180"
    environment:
      - APISIX_STAND_ALONE=true
      - APISIX_ADMIN_KEY=${APISIX_ADMIN_KEY:?APISIX_ADMIN_KEY required - run scripts/generate-secrets.sh}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  etcd:
    restart: always
    volumes:
      - etcd_data:/etcd-data
    command:
      - /usr/local/bin/etcd
      - --data-dir=/etcd-data
      - --name=etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --snapshot-count=10000
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  #---------------------------------------------------------------------------
  # OpenIDX Services - Production Overrides
  #---------------------------------------------------------------------------

  identity-service:
    restart: always
    environment:
      - APP_ENV=production
      # Single-tenant install: attach the seeded default org when no tenant
      # subdomain/JWT signal is present, so org-scoped reads aren't empty under RLS.
      # Set DEFAULT_ORG_FALLBACK=false for a true multi-tenant (subdomain-per-org) deploy.
      - DEFAULT_ORG_FALLBACK=${DEFAULT_ORG_FALLBACK:-true}
      - DEFAULT_ORG_ID=${DEFAULT_ORG_ID:-00000000-0000-0000-0000-000000000010}
      - DATABASE_URL=postgres://openidx_app:${OPENIDX_APP_PASSWORD:?OPENIDX_APP_PASSWORD required - run scripts/generate-secrets.sh}@postgres:5432/openidx?sslmode=${DATABASE_SSL_MODE:-require}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379
      - OPA_URL=http://opa:8281
      - OAUTH_ISSUER=https://openidx.tdv.org
      - OAUTH_JWKS_URL=https://openidx.tdv.org/.well-known/jwks.json
      - SMTP_HOST=${SMTP_HOST:-smtp.mailgun.org}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:?SMTP_USER required}
      - SMTP_PASSWORD=${SMTP_PASSWORD:?SMTP_PASSWORD required}
      - SMTP_FROM=${SMTP_FROM:-noreply@openidx.tdv.org}
      - SMTP_USE_TLS=true
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OPENIDX_ENABLE_RATE_LIMIT=true
      - OPENIDX_RATE_LIMIT_RPM=${RATE_LIMIT_RPM:-60}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_ENDPOINT:-jaeger:4317}
      - OTEL_SERVICE_NAME=identity-service
      - TRACING_ENABLED=${TRACING_ENABLED:-false}
    ports:
      - "127.0.0.1:8001:8001"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  governance-service:
    restart: always
    environment:
      - APP_ENV=production
      # Single-tenant install: attach the seeded default org when no tenant
      # subdomain/JWT signal is present, so org-scoped reads aren't empty under RLS.
      # Set DEFAULT_ORG_FALLBACK=false for a true multi-tenant (subdomain-per-org) deploy.
      - DEFAULT_ORG_FALLBACK=${DEFAULT_ORG_FALLBACK:-true}
      - DEFAULT_ORG_ID=${DEFAULT_ORG_ID:-00000000-0000-0000-0000-000000000010}
      - DATABASE_URL=postgres://openidx_app:${OPENIDX_APP_PASSWORD:?OPENIDX_APP_PASSWORD required - run scripts/generate-secrets.sh}@postgres:5432/openidx?sslmode=${DATABASE_SSL_MODE:-require}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379
      - OPA_URL=http://opa:8281
      - OAUTH_ISSUER=https://openidx.tdv.org
      - OAUTH_JWKS_URL=https://openidx.tdv.org/.well-known/jwks.json
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OPENIDX_ENABLE_RATE_LIMIT=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_ENDPOINT:-jaeger:4317}
      - OTEL_SERVICE_NAME=governance-service
      - TRACING_ENABLED=${TRACING_ENABLED:-false}
    ports:
      - "127.0.0.1:8002:8002"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

