      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=${ELASTICSEARCH_USERNAME:-elastic}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD:?ELASTICSEARCH_PASSWORD required - run scripts/generate-secrets.sh}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OPENIDX_ENABLE_RATE_LIMIT=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_ENDPOINT:-jaeger:4317}
      - OTEL_SERVICE_NAME=audit-service
      - TRACING_ENABLED=${TRACING_ENABLED:-false}
    ports:
      - "127.0.0.1:8004:8004"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  admin-api:
    restart: always
    environment:
      - APP_ENV=production
      # Single-tenant install: attach the seeded default org when no tenant
      # subdomain/JWT signal is present, so org-scoped reads aren't empty under RLS.
      # Set DEFAULT_ORG_FALLBACK=false for a true multi-tenant (subdomain-per-org) deploy.
      - DEFAULT_ORG_FALLBACK=${DEFAULT_ORG_FALLBACK:-true}
      - DEFAULT_ORG_ID=${DEFAULT_ORG_ID:-00000000-0000-0000-0000-000000000010}
      - DATABASE_URL=postgres://openidx_app:${OPENIDX_APP_PASSWORD:?OPENIDX_APP_PASSWORD required - run scripts/generate-secrets.sh}@postgres:5432/openidx?sslmode=${DATABASE_SSL_MODE:-require}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379
      - OPA_URL=http://opa:8281
      - OAUTH_ISSUER=https://openidx.tdv.org
      - OAUTH_JWKS_URL=https://openidx.tdv.org/.well-known/jwks.json
      - SMTP_HOST=${SMTP_HOST:-smtp.mailgun.org}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:?SMTP_USER required}
      - SMTP_PASSWORD=${SMTP_PASSWORD:?SMTP_PASSWORD required}
      - SMTP_FROM=${SMTP_FROM:-noreply@openidx.tdv.org}
      - SMTP_USE_TLS=true
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OPENIDX_ENABLE_RATE_LIMIT=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_ENDPOINT:-jaeger:4317}
      - OTEL_SERVICE_NAME=admin-api
      - TRACING_ENABLED=${TRACING_ENABLED:-false}
    ports:
      - "127.0.0.1:8005:8005"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  oauth-service:
    restart: always
    environment:
      - APP_ENV=production
      # Single-tenant install: attach the seeded default org when no tenant
      # subdomain/JWT signal is present, so org-scoped reads aren't empty under RLS.
      # Set DEFAULT_ORG_FALLBACK=false for a true multi-tenant (subdomain-per-org) deploy.
      - DEFAULT_ORG_FALLBACK=${DEFAULT_ORG_FALLBACK:-true}
      - DEFAULT_ORG_ID=${DEFAULT_ORG_ID:-00000000-0000-0000-0000-000000000010}
      - DATABASE_URL=postgres://openidx_app:${OPENIDX_APP_PASSWORD:?OPENIDX_APP_PASSWORD required - run scripts/generate-secrets.sh}@postgres:5432/openidx?sslmode=${DATABASE_SSL_MODE:-require}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OPENIDX_ENABLE_RATE_LIMIT=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_ENDPOINT:-jaeger:4317}
      - OTEL_SERVICE_NAME=oauth-service
      - TRACING_ENABLED=${TRACING_ENABLED:-false}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET required}
      - OAUTH_ISSUER=https://openidx.tdv.org
      - PORT=8006
    ports:
      - "127.0.0.1:8006:8006"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  access-service:
    restart: always
    environment:
      - APP_ENV=production
      # Single-tenant install: attach the seeded default org when no tenant
      # subdomain/JWT signal is present, so org-scoped reads aren't empty under RLS.
      # Set DEFAULT_ORG_FALLBACK=false for a true multi-tenant (subdomain-per-org) deploy.
      - DEFAULT_ORG_FALLBACK=${DEFAULT_ORG_FALLBACK:-true}
      - DEFAULT_ORG_ID=${DEFAULT_ORG_ID:-00000000-0000-0000-0000-000000000010}
      - DATABASE_URL=postgres://openidx_app:${OPENIDX_APP_PASSWORD:?OPENIDX_APP_PASSWORD required - run scripts/generate-secrets.sh}@postgres:5432/openidx?sslmode=${DATABASE_SSL_MODE:-require}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379
      - OAUTH_ISSUER=https://openidx.tdv.org
      - OAUTH_JWKS_URL=https://openidx.tdv.org/.well-known/jwks.json
      - GOVERNANCE_URL=http://governance-service:8002
      - AUDIT_URL=http://audit-service:8004
      - ACCESS_SESSION_SECRET=${ACCESS_SESSION_SECRET:?ACCESS_SESSION_SECRET required}
      - ACCESS_PROXY_DOMAIN=openidx.tdv.org
      - ZITI_ENABLED=${ZITI_ENABLED:-true}
      - ZITI_CTRL_URL=https://ziti-controller.openidx.tdv.org:1280
      - ZITI_ADMIN_USER=${ZITI_ADMIN_USER:-admin}
      - ZITI_ADMIN_PASSWORD=${ZITI_PWD:?ZITI_PWD required}
      - ZITI_IDENTITY_DIR=/ziti
      # Browser-facing ZAC console URL; empty derives <ZITI_CTRL_URL>/zac/
      - ZITI_CONSOLE_URL=${ZITI_CONSOLE_URL:-}
      - GUACAMOLE_URL=http://guacamole:8080/guacamole
      - GUACAMOLE_ADMIN_USER=guacadmin
      - GUACAMOLE_ADMIN_PASSWORD=${GUACAMOLE_ADMIN_PASSWORD:?GUACAMOLE_ADMIN_PASSWORD required}
      - CONTINUOUS_VERIFY_ENABLED=${CONTINUOUS_VERIFY_ENABLED:-true}
      - CONTINUOUS_VERIFY_INTERVAL=${CONTINUOUS_VERIFY_INTERVAL:-30}
      - BROWZER_ENABLED=${BROWZER_ENABLED:-true}
      - BROWZER_CLIENT_ID=${BROWZER_CLIENT_ID:-browzer-client}
      - BROWZER_TARGETS_PATH=/shared-config/config.json
      - BROWZER_ROUTER_CONFIG_PATH=/shared-config/browzer-router.conf
      - BROWZER_CERTS_PATH=/shared-certs
      - APISIX_CONFIG_PATH=/apisix-conf/apisix.yaml
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OPENIDX_ENABLE_RATE_LIMIT=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_ENDPOINT:-jaeger:4317}
      - OTEL_SERVICE_NAME=access-service
      - TRACING_ENABLED=${TRACING_ENABLED:-false}
    ports:
      - "127.0.0.1:8007:8007"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  #---------------------------------------------------------------------------
  # Admin Console - Production Build
  #---------------------------------------------------------------------------

  admin-console:
    restart: always
    build:
      context: ../../web/admin-console
      dockerfile: ../../deployments/docker/Dockerfile.admin-console
      network: host
      args:
        - SRC_DIR=.
        - VITE_API_URL=https://openidx.tdv.org
        - VITE_OAUTH_URL=https://openidx.tdv.org
        - VITE_OAUTH_CLIENT_ID=admin-console
        - VITE_AUTH_PROVIDER=openidx
    environment:
      - VITE_API_URL=https://openidx.tdv.org
      - VITE_OAUTH_URL=https://openidx.tdv.org
      - VITE_OAUTH_CLIENT_ID=admin-console
      - VITE_AUTH_PROVIDER=openidx
    ports:
      - "127.0.0.1:3000:3000"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  #---------------------------------------------------------------------------
  # Production SSL Termination with nginx and certbot
  #---------------------------------------------------------------------------

  nginx-proxy:
    image: nginx:alpine
    container_name: openidx-nginx-proxy
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_webroot:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - admin-console
      - apisix
    command: nginx -g 'daemon off;'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot:latest
    container_name: openidx-certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: /bin/sh -c "/scripts/certbot-entrypoint.sh"
    depends_on:
      - nginx-proxy

  #---------------------------------------------------------------------------
  # Production Monitoring - OPA
  #---------------------------------------------------------------------------

  opa:
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  #---------------------------------------------------------------------------
  # Demo Apps - Optional (disabled in production by default)
  #---------------------------------------------------------------------------

  demo-app:
    restart: "no"
    profiles:
      - demo

  simple-web:
    restart: "no"
    profiles:
      - demo

  mailpit:
    restart: "no"
    profiles:
      - demo

  #---------------------------------------------------------------------------
  # Production Backup Service
  #---------------------------------------------------------------------------

  backup-scheduler:
    image: alpine:3.19
    container_name: openidx-backup-scheduler
    restart: always
    volumes:
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      - ${POSTGRES_BACKUP_PATH:-./backups/postgres}:/backups
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - postgres
    entrypoint: /bin/sh
    command:
      - -c
      - |
        apk add --no-cache dcron postgresql-client
        echo "${BACKUP_SCHEDULE:-0 2 * * *} /scripts/backup.sh" | crontab -
        crond -f -l 2
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=openidx
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      - POSTGRES_DB=openidx
      - BACKUP_SCHEDULE=${BACKUP_SCHEDULE:-0 2 * * *}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  #---------------------------------------------------------------------------
  # Production Log Aggregation (Optional - enable with --profile logging)
  #---------------------------------------------------------------------------

  loki:
    restart: "no"
    profiles:
      - logging

  promtail:
    restart: "no"
    profiles:
      - logging

  prometheus:
    restart: "no"
    profiles:
      - monitoring

  grafana:
    restart: "no"
    profiles:
      - monitoring

  jaeger:
    restart: "no"
    profiles:
      - monitoring

  #---------------------------------------------------------------------------
  # BrowZer and Ziti (Optional - enable with --profile ziti)
  #
  # Long-running Ziti data/control-plane services restart automatically in
  # production — the overlay carries live network sessions, so a crashed
  # controller/router must come back without operator action. Only the
  # one-shot init jobs (cert/enrollment bootstrap) stay restart: "no".
  #---------------------------------------------------------------------------

  browzer-cert-init:
    restart: "no" # one-shot init job
    profiles:
      - ziti

  browzer-bootstrapper:
    restart: unless-stopped
    profiles:
      - ziti

  browzer-router:
    restart: unless-stopped
    profiles:
      - ziti

  ziti-controller:
    restart: unless-stopped
    profiles:
      - ziti

  ziti-router-init:
    restart: "no" # one-shot init job
    profiles:
      - ziti

  ziti-router:
    restart: unless-stopped
    profiles:
      - ziti

  tls-proxy:
    restart: unless-stopped
    profiles:
      - ziti

  guacd:
    restart: unless-stopped
    profiles:
      - ziti

  guacamole:
    restart: unless-stopped
    profiles:
      - ziti

  guacamole-zbr-proxy:
    restart: unless-stopped
    profiles:
      - ziti

#---------------------------------------------------------------------------
# Production Volumes
#---------------------------------------------------------------------------

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${POSTGRES_DATA_PATH:-./data/postgres}

  pg_certs:
    driver: local

  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${REDIS_DATA_PATH:-./data/redis}

  elasticsearch_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ELASTICSEARCH_DATA_PATH:-./data/elasticsearch}

  etcd_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ETCD_DATA_PATH:-./data/etcd}

  ziti_controller_data:
    driver: local

  ziti_controller_pki:
    driver: local

  ziti_router_data:
    driver: local

  ziti_router_shared:
    driver: local

  ziti_access_proxy:
    driver: local

  browzer_certs:
    driver: local

  browzer_config:
    driver: local

  apisix_config:
    driver: local

  certbot_certs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CERTBOT_CERTS_PATH:-./data/certbot}

  certbot_webroot:
    driver: local

#---------------------------------------------------------------------------
# Production Networks
#---------------------------------------------------------------------------

networks:
  openidx-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: openidx-prod
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
