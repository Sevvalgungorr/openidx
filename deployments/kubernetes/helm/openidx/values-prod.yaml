# OpenIDX — production value overrides
#
#   helm upgrade --install openidx deployments/kubernetes/helm/openidx \
#     -f deployments/kubernetes/helm/openidx/values-prod.yaml
#
# This layers production posture on top of values.yaml: pinned image tags,
# autoscaling, network policies, secrets pulled from an external store, and
# managed datastores (RDS/ElastiCache/managed Elasticsearch) instead of the
# in-cluster bitnami subcharts. Replace the placeholder hostnames and the
# secretStoreRef name with your environment's values before deploying.

global:
  environment: "production"
  logLevel: "info"
  # Pin to an immutable release tag in production — never run :latest.
  # Override per service below; this is a documentation anchor.

# ----- Secrets come from an external store (AWS Secrets Manager / Vault) -----
# This disables the in-chart plaintext Secret and the in-cluster DATABASE_URL/
# REDIS_URL builder; both are pulled from the store instead. Store the full
# connection strings (pointing at managed RDS/ElastiCache) under
# <remoteKeyPrefix>/database-url and <remoteKeyPrefix>/redis-url.
externalSecrets:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: "openidx-secret-store"   # <-- your ClusterSecretStore
    kind: ClusterSecretStore
  remoteKeyPrefix: "openidx/prod"
  # Tier 1.6 read replica. Terraform provisions one RDS read replica in prod
  # (read_replica_count = 1) and exposes rds_reader_endpoints. To activate the
  # read pool (read-mostly, lag-tolerant queries offload to the replica; writes
  # and security-critical reads stay on the primary — proven by `make ha-drill`):
  #   1. store <remoteKeyPrefix>/database-read-url = the RDS reader endpoint
  #   2. flip this to true and `helm upgrade`.
  # Left false so the ExternalSecret does not reference a missing key on a fresh
  # cutover. Turn on as a follow-on step (see docs/tier3b-cutover-runbook.md §1b).
  readReplica: false

# ----- Managed datastores: disable the in-cluster subcharts -----
postgresql:
  enabled: false
redis:
  enabled: false
elasticsearch:
  enabled: false

# Point the services at managed endpoints (Elasticsearch via config; Postgres
# and Redis via the DATABASE_URL/REDIS_URL external secret above).
config:
  elasticsearchUrl: "https://opensearch.prod.internal:9200"
  oauthIssuer: "https://auth.openidx.example.com"
  oauthJwksUrl: "https://auth.openidx.example.com/.well-known/jwks.json"
  viteApiUrl: "https://api.openidx.example.com"
  viteOauthUrl: "https://auth.openidx.example.com"
  # Multi-tenancy: drive per-tenant subdomains off this base domain and fail
  # closed (no implicit default org) when a request can't be resolved to a tenant.
  tenantBaseDomain: "openidx.example.com"
  defaultOrgFallback: false
  # defaultOrgId is irrelevant when defaultOrgFallback is false; left at the chart default.

# Require TLS to the managed database. Services run with APP_ENV=production and
# will refuse to start if this is 'disable'. Use 'verify-full' with a pinned CA
# (DATABASE_SSL_ROOT_CERT via the external secret) for the strongest posture.
database:
  sslMode: require
  # Fail a dial fast during an RDS Multi-AZ failover so the pool re-dials the
  # promoted primary instead of hanging on the dead one and exhausting itself.
  connectTimeout: "5s"
  # Cap any single query at 30s. Generous enough for audit/governance reports
  # while preventing a query on a degraded primary from pinning a connection
  # indefinitely. Migrations run out-of-band and are unaffected by this chart.
  statementTimeout: "30s"

# ----- Production hardening -----
networkPolicy:
  enabled: true

serviceTLS:
  enabled: false   # set true + provide certSecret/caSecret for inter-service mTLS

# Spread replicas and allow horizontal scaling under load. Pin every image to
# the release being deployed.
identityService:
  image: { tag: "v0.1.0" }
  replicaCount: 3
  autoscaling: { enabled: true, minReplicas: 3, maxReplicas: 12 }
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 768Mi }

governanceService:
  image: { tag: "v0.1.0" }
  replicaCount: 3
  autoscaling: { enabled: true, minReplicas: 3, maxReplicas: 10 }
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 768Mi }

provisioningService:
  image: { tag: "v0.1.0" }
  replicaCount: 2
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 8 }
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 768Mi }

auditService:
  image: { tag: "v0.1.0" }
  replicaCount: 3
  autoscaling: { enabled: true, minReplicas: 3, maxReplicas: 10 }
  # Restrict who may open the real-time audit WebSocket stream (CSWSH defense).
  allowedOrigins:
    - https://admin.openidx.example.com
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 768Mi }

adminApi:
  image: { tag: "v0.1.0" }
  replicaCount: 2
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 8 }
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 768Mi }

oauthService:
  image: { tag: "v0.1.0" }
  replicaCount: 3
  autoscaling: { enabled: true, minReplicas: 3, maxReplicas: 12 }
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 768Mi }

gatewayService:
  image: { tag: "v0.1.0" }
  replicaCount: 3
  autoscaling: { enabled: true, minReplicas: 3, maxReplicas: 12 }
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

accessService:
  image: { tag: "v0.1.0" }
  replicaCount: 2
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 8 }
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 768Mi }

adminConsole:
  image: { tag: "v0.1.0" }
  replicaCount: 2
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 6 }
  ingress:
    enabled: true
    hosts:
      - host: admin.openidx.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: admin-console-tls
        hosts:
          - admin.openidx.example.com

# Public API ingress.
# HA note: these Ingresses use ingressClassName "nginx"; the controller that
# serves them must be installed HA (≥2 replicas behind an AWS NLB) — see
# deployments/kubernetes/ingress-nginx-values.yaml (`make helm-ingress-nginx`).
ingress:
  enabled: true
  hosts:
    - host: api.openidx.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: api-tls
      hosts:
        - api.openidx.example.com

# ----- Zero-trust overlay (Ziti fabric) -----
#
# Enabled in prod because the overlay is what lets an internal application be
# published with NO inbound firewall rule: the app binds loopback, the router
# dials out, and nothing is exposed. Left off in the default values so a plain
# `helm install` does not stand up fabric components nobody asked for.
#
# Sizing is an availability decision, not a capacity one:
#   controller.replicas: 3  — Raft needs a majority. 1 is a single point of
#     failure for the whole overlay control plane, and 2 is worse than 1 for a
#     quorum (any single loss deadlocks it). 3 survives one loss.
#   router.replicas: 2      — the data plane. With 1 router, losing it takes
#     every dark application offline at once. The #all edge-router policies
#     mean a second router serves traffic with no policy change.
#
# The chart adds a PDB and soft node anti-affinity automatically once replicas
# exceed 1, so a node drain cannot take the quorum with it.
zitiFabric:
  enabled: true
  controller:
    replicas: 3
    persistence:
      # Raft state must survive a pod reschedule; ephemeral storage would lose
      # the cluster's own membership record.
      size: 10Gi
  router:
    replicas: 2
