{{- if .Values.auditService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openidx.fullname" . }}-audit-service
  labels:
    {{- include "openidx.labels" . | nindent 4 }}
    app.kubernetes.io/component: audit-service
spec:
  replicas: {{ .Values.auditService.replicaCount }}
  {{- include "openidx.rollingStrategy" . | nindent 2 }}
  selector:
    matchLabels:
      {{- include "openidx.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: audit-service
  template:
    metadata:
      labels:
        {{- include "openidx.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: audit-service
    spec:
      {{- include "openidx.gracefulTermination" . | nindent 6 }}
      {{- include "openidx.topologySpread" (dict "ctx" . "component" "audit-service") | nindent 6 }}
      serviceAccountName: {{ include "openidx.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: {{ .Values.podAntiAffinity.weight | default 100 }}
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: audit-service
                topologyKey: kubernetes.io/hostname
      {{- end }}
      containers:
        - name: audit-service
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.auditService.image.repository }}:{{ .Values.auditService.image.tag }}"
          imagePullPolicy: {{ .Values.auditService.image.pullPolicy }}
          {{- include "openidx.preStopHook" . | nindent 10 }}
          ports:
            - name: http
              containerPort: 8004
              protocol: TCP
          env:
            - name: APP_ENV
              value: {{ .Values.global.environment | default "production" | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.global.logLevel | default "info" | quote }}
            - name: OPENIDX_AUDIT_STREAM_ALLOWED_ORIGINS
              value: {{ .Values.auditService.allowedOrigins | default (list) | join "," | quote }}
            {{- if .Values.auditService.enableSecurityLogging }}
            - name: AUDIT_STREAM_SECURITY_LOGGING
              value: "true"
            {{- end }}
            - name: ELASTICSEARCH_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "openidx.fullname" . }}-config
                  key: ELASTICSEARCH_URL
            {{- if .Values.serviceTLS.enabled }}
            - name: TLS_ENABLED
              value: "true"
            - name: TLS_CERT_FILE
              value: "/tls/tls.crt"
            - name: TLS_KEY_FILE
              value: "/tls/tls.key"
            {{- if .Values.serviceTLS.caSecret }}
            - name: TLS_CA_FILE
              value: "/tls-ca/ca.crt"
            {{- end }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "openidx.fullname" . }}-db-url
            - secretRef:
                name: {{ include "openidx.fullname" . }}-secrets
            - configMapRef:
                name: {{ include "openidx.fullname" . }}-config
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
              {{- if .Values.serviceTLS.enabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
              {{- if .Values.serviceTLS.enabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.auditService.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.serviceTLS.enabled }}
          volumeMounts:
            - name: tls-certs
              mountPath: /tls
              readOnly: true
            {{- if .Values.serviceTLS.caSecret }}
            - name: tls-ca
              mountPath: /tls-ca
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if .Values.serviceTLS.enabled }}
      volumes:
        - name: tls-certs
          secret:
            secretName: {{ .Values.serviceTLS.certSecret }}
        {{- if .Values.serviceTLS.caSecret }}
        - name: tls-ca
          secret:
            secretName: {{ .Values.serviceTLS.caSecret }}
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openidx.fullname" . }}-audit-service
  labels:
    {{- include "openidx.labels" . | nindent 4 }}
    app.kubernetes.io/component: audit-service
spec:
  type: {{ .Values.auditService.service.type }}
  ports:
    - port: {{ .Values.auditService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "openidx.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: audit-service
{{- end }}
