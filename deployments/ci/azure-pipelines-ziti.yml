# Azure DevOps: reach OpenSecOps over the Ziti overlay.
#
# The CI agent is a Microsoft-hosted Ubuntu VM on the public internet. It has no
# route to the internal network and no inbound port is opened for it. Instead the
# agent runs a Ziti tunneller, authenticates with its own enrolled identity and
# dials the service over the overlay.
#
# WHAT MUST EXIST BEFORE THIS RUNS (deployments/ci/setup-ci-overlay-access.sh):
#   - a dialable service carrying an intercept.v1 config (a host.v1-only service
#     is reachable by BrowZer but gives a tunneller no address to intercept)
#   - a Dial policy binding the CI identity role to that service
#   - an edge-router policy and a service-edge-router policy, otherwise the
#     identity authenticates fine and then simply cannot see the service
#   - an enrolled CI identity uploaded as a Secure File (it is ~8 KB, so it
#     cannot be a pipeline variable: those are capped at 4096 characters)
#
# The tunneller and the controller are DIFFERENT PROJECTS with independent
# version lines (ziti-tunnel-sdk-c vs openziti/ziti). Pinning the tunneller to
# the controller's version is a guaranteed break: v1.1.15 does not exist and
# the download 404s.

variables:
  # A variable group is referenced with LIST syntax. Mixing the mapping form
  # (KEY: value) with a group in the same block is a schema error, so once a
  # group is used every entry must be a list item.
  #
  # Create the group in Pipelines > Library and authorise this pipeline to use
  # it. The group holds SHORT secrets and values SHARED across pipelines;
  # per-run values belong below, and the Ziti identity is a Secure File
  # because it exceeds the variable size limit.
  - group: ZitiCIVars

  # Tunneller release (github.com/openziti/ziti-tunnel-sdk-c). NOT the controller version.
  - name: ZITI_TUNNELER_VERSION
    value: "1.18.3"
  # Overlay DNS name and port. Asserted against the controller at run time
  # (step 3) rather than trusted: a stale value here fails as a confusing DNS
  # timeout instead of a clear error.
  - name: ZITI_INTERCEPT_DNS
    value: "secops.ziti"
  - name: SECOPS_PORT
    value: "443"
  # The app selects its certificate and routes by hostname, so TLS/Host must
  # carry its real name even though we connect via the overlay name.
  - name: SECOPS_HOST
    value: "secops.tdv.org"
  # Per-RUN values (e.g. $(Build.Repository.Name)) belong HERE, not in a
  # variable group: groups are static and shared, and a $(...) macro stored
  # inside one is not guaranteed to expand -- it can arrive empty or as the
  # literal text.

steps:
  - script: |
      set -euo pipefail
      url="https://github.com/openziti/ziti-tunnel-sdk-c/releases/download/v${ZITI_TUNNELER_VERSION}/ziti-edge-tunnel-Linux_x86_64.zip"
      # Fail on the download itself rather than on a later confusing unzip error.
      curl -sSLf "$url" -o zet.zip
      sudo apt-get update -y >/dev/null && sudo apt-get install -y unzip >/dev/null
      unzip -o zet.zip -d /tmp/zet >/dev/null
      sudo install /tmp/zet/ziti-edge-tunnel /usr/local/bin/ziti-edge-tunnel
      ziti-edge-tunnel version
    displayName: "Ziti: install tunneller"

  # The enrolled identity is ~8 KB, and an Azure pipeline VARIABLE is capped at
  # 4096 characters -- base64 of it is 10908, so it cannot be a variable at all.
  # Compressing does not help either (gzip+base64 is still 5524). Secure Files
  # has no such limit and is Microsoft's own recommendation for exactly this.
  #
  # Authorise the pipeline once: Pipelines > Library > Secure files >
  # ci-identity.json > Pipeline permissions.
  - task: DownloadSecureFile@1
    name: zitiIdentity
    displayName: "Ziti: fetch identity (secure file)"
    inputs:
      secureFile: ci-identity.json

  - script: |
      set -euo pipefail
      # Use the downloaded file WHERE IT IS. DownloadSecureFile already places
      # it under Agent.TempDirectory, so copying it to a path built from that
      # same directory makes source and destination identical and cp fails
      # with "are the same file". Referencing the task output directly also
      # keeps working if Azure changes the location.
      id="$(zitiIdentity.secureFilePath)"
      if [ -z "${id:-}" ] || [ ! -s "$id" ]; then
        echo "Secure file 'ci-identity.json' was not downloaded."
        echo "Upload it under Pipelines > Library > Secure files and grant this"
        echo "pipeline permission. See docs/ci-over-ziti-overlay.md section 5."
        exit 1
      fi
      chmod 600 "$id" 2>/dev/null || true
      # An enrolled identity is JSON carrying the controller address (ztAPI);
      # a JWT is three dot-separated segments. Confusing the two is the most
      # common mistake and would otherwise surface as a TLS error much later.
      if ! grep -q '"ztAPI"' "$id"; then
        echo "The secure file is not an enrolled identity (no ztAPI field)."
        echo "Did you store the JWT instead? Enrol it first:"
        echo "  ziti-edge-tunnel enroll --jwt <file>.jwt --identity <file>.json"
        exit 1
      fi
      # 'run' needs root: it creates a TUN device and installs a resolver so the
      # overlay DNS name resolves for ordinary tools like curl.
      sudo nohup ziti-edge-tunnel run --identity "$id" \
        > "$(Agent.TempDirectory)/ziti.log" 2>&1 &
      echo "waiting for overlay DNS ${ZITI_INTERCEPT_DNS} ..."
      for _ in $(seq 1 30); do
        getent hosts "$ZITI_INTERCEPT_DNS" >/dev/null 2>&1 && break
        sleep 2
      done
      if ! getent hosts "$ZITI_INTERCEPT_DNS" >/dev/null 2>&1; then
        echo "overlay did not come up; tunneller log follows:"
        cat "$(Agent.TempDirectory)/ziti.log"
        exit 1
      fi
      getent hosts "$ZITI_INTERCEPT_DNS"
    displayName: "Ziti: connect overlay"

  - script: |
      set -euo pipefail
      # Proof the overlay carried the request, not just that something answered.
      # --resolve pins the app's hostname to the overlay IP, so TLS SNI and the
      # Host header carry the real name while the connection still goes through
      # the tunneller. Without this the origin answers 404 (wrong Host) or the
      # handshake fails outright, which looks like a broken service.
      # `set -euo pipefail` + a failing getent kills the step with NO message
      # at all: the overlay name not resolving is by far the most likely
      # runtime failure here, and it was the one failure that said nothing.
      # Measured: with the tunnel up but the name unresolved, the step exited
      # silently right here. `|| true` keeps the pipeline alive so the cause
      # can be reported instead of guessed.
      ip="$(getent hosts "$ZITI_INTERCEPT_DNS" 2>/dev/null | awk '{print $1}' | head -1 || true)"
      if [ -z "$ip" ]; then
        echo "OVERLAY NAME DID NOT RESOLVE: $ZITI_INTERCEPT_DNS"
        echo "The tunneller is not intercepting this name. Either the identity"
        echo "has no access to the service, or the tunneller is not running."
        echo "Without it, --resolve would be malformed and curl would reach"
        echo "the wrong host (or nothing)."
        exit 1
      fi
      echo "overlay address for ${ZITI_INTERCEPT_DNS}: ${ip}"
      # -sSf collapses every failure into "curl: (22) ... error: 502", which
      # cannot tell an OVERLAY problem from an APPLICATION problem. Measured on
      # 2026-08-13: / answered 200 while /health and /api answered 502 on 30/30
      # tries -- the fabric was fine and the API behind the origin proxy was
      # down. Reading that as "the overlay is broken" sends the wrong team
      # looking. Capture the status and say which layer failed.
      hbody="$(mktemp)"
      hcode=000
      tries=40
      for attempt in $(seq 1 "$tries"); do
        hcode="$(curl -s -o "$hbody" -w '%{http_code}' \
          --resolve "${SECOPS_HOST}:${SECOPS_PORT}:${ip}" \
          "https://${SECOPS_HOST}:${SECOPS_PORT}/health" || true)"
        hcode="${hcode:-000}"
        [ "$hcode" = 200 ] && break
        sleep 2
      done
      echo "HTTP $hcode"; cat "$hbody"; echo
      if [ "$hcode" = 000 ]; then
        echo "OVERLAY PROBLEM: no HTTP response at all."
        echo "The tunneller could not carry the connection: the identity, the"
        echo "dial policy or the router path is the place to look."
        exit 1
      fi
      case "$hcode" in
        5*)
          echo "APPLICATION PROBLEM, NOT AN OVERLAY PROBLEM."
          echo "The overlay delivered the request and the origin answered"
          echo "$hcode, so the fabric, the identity and the policies are all"
          echo "working. The service behind the origin proxy is failing."
          echo "Check with the OpenSecOps owners; nothing here needs changing."
          exit 1 ;;
      esac
      body="$(cat "$hbody")"
      # A 200 alone is not proof: a captive portal or a proxy also returns 200.
      echo "$body" | grep -q '"status":"ok"' \
        || { echo "unexpected health payload"; exit 1; }
      # /health is served by the frontend, so it proves the host is reachable
      # but NOT that the API behind it is routed. Probe a real API path too.
      # 401 is the expected answer without credentials and is a PASS here: it
      # means the route exists and authentication is enforced. Note that /api
      # itself 404s -- only concrete sub-paths are published, so probing the
      # root and concluding "there is no API" is wrong (I made exactly that
      # mistake).
      # The origin load-balances across several backends and some of them are
      # down: measured 2026-08-13, /api/imports/parsers answered correctly on
      # only 4 of 60 tries (the other 56 were 502 from the origin proxy, not
      # from the overlay). A single probe therefore fails ~93% of the time even
      # though the API is reachable. Retry before concluding anything: this is
      # a read-only GET, so retrying it is free of side effects.
      #
      # WHY 40 AND NOT 12: at a 7% success rate, 12 tries still miss 0.93^12 =
      # 42% of the time. I first wrote 12 and it passed 5/5 by luck against the
      # live origin; a local fault-injection run at the measured rate failed it.
      # 40 tries miss 5%, and the loop exits as soon as one succeeds, so the
      # healthy case costs nothing.
      code=000
      tries=40
      for attempt in $(seq 1 "$tries"); do
        code="$(curl -s -o /dev/null -w '%{http_code}' \
          --resolve "${SECOPS_HOST}:${SECOPS_PORT}:${ip}" \
          "https://${SECOPS_HOST}:${SECOPS_PORT}/api/imports/parsers" || true)"
        code="${code:-000}"
        case "$code" in 200|401|403) break ;; esac
        sleep 2
      done
      case "$code" in
        200|401|403) echo "API routed (/api/imports/parsers -> $code)" ;;
        5*) echo "API not routed (/api/imports/parsers -> $code after $tries tries)"
            echo "The origin answered, so the OVERLAY IS WORKING. Its backend"
            echo "pool is unhealthy. This is for the OpenSecOps owners."
            exit 1 ;;
        *) echo "API not routed (/api/imports/parsers -> $code)"; exit 1 ;;
      esac
      echo "reachable over the overlay"
    displayName: "OpenSecOps: connectivity check"

  # Produce the report the upload step publishes. Semgrep is used here because
  # OpenSecOps ships a "Semgrep JSON Report" parser, so this is `--json`, NOT
  # SARIF: the importer keys parsers by format and a mismatched file imports as
  # zero findings while still reporting success.
  #
  # RULESET MATTERS, measured on a file with a real subprocess(shell=True) bug:
  #   p/ci      -> 0 findings   (and errors: [] -- it looks like a clean scan)
  #   p/default -> 1
  #   p/python  -> 1
  #   auto      -> 1
  # So `auto` is the default here. A narrow ruleset that silently finds nothing
  # is indistinguishable from secure code, which is the failure mode this whole
  # pipeline is written to avoid.
  - script: |
      set -euo pipefail
      python3 -m pip install --quiet --user semgrep
      export PATH="$HOME/.local/bin:$PATH"
      semgrep --version
      # Where to scan. SCAN_PATH defaults to the repo root, but a monorepo can
      # point it at one project. The path is reported so a report that covers
      # the wrong tree is visible rather than assumed.
      scan_path="${SCAN_PATH:-.}"
      echo "scanning: $scan_path"

      # Language auto-detection. The pipeline is shared across repos, and a
      # .NET repo is the case this was added for: `auto` already loads C#
      # rules, but build output (bin/obj) is scanned too, so the SAME finding
      # is reported once from source and once from the copy under bin/ --
      # inflating counts and pointing reviewers at a generated file.
      # Detection is by project file, not by extension, so an empty folder
      # never changes the ruleset.
      ruleset_args=(--config="$SEMGREP_RULES")
      if find "$scan_path" \( -name '*.csproj' -o -name '*.sln' -o -name '*.fsproj' -o -name '*.vbproj' \) \
           -not -path '*/bin/*' -not -path '*/obj/*' -print -quit | grep -q .; then
        echo "detected: .NET project"
        # Separate --config flags. A comma-joined list is NOT a list to
        # semgrep: it looks for a config literally named "auto,p/csharp",
        # scans 0 files and, with `|| true`, still exits green -- a scan of
        # nothing that publishes as a clean report. Measured, not assumed.
        ruleset_args+=(--config=p/csharp)
        # Build output is not source. Excluding it here (rather than editing a
        # committed .semgrepignore) keeps the pipeline usable in repos it does
        # not own.
        ruleset_args+=(--exclude=bin --exclude=obj)
      fi

      # --error would fail the build on findings; we want them PUBLISHED, so
      # the scan itself must succeed even when it finds problems.
      semgrep scan "${ruleset_args[@]}" --json --quiet \
        -o "$SCAN_FILE" . || true
      [ -s "$SCAN_FILE" ] || { echo "semgrep produced no report"; exit 1; }
      # A report over ZERO files is the dangerous shape: it looks exactly like
      # clean code. A bad ruleset name produces precisely this, so it is a
      # hard failure, not a diagnostic.
      scanned="$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(len((d.get('paths') or {}).get('scanned') or []))" "$SCAN_FILE" 2>/dev/null || echo 0)"
      echo "files scanned: $scanned"
      if [ "$scanned" -eq 0 ]; then
        echo "NOT SCANNED: semgrep read 0 files. This is not a clean scan."
        echo "Usual cause: an invalid --config value (a comma-joined list is"
        echo "not a list), or SCAN_PATH pointing outside the checkout."
        exit 1
      fi
      # Diagnostics, not a gate: shows severities, findings missing
      # extra.metadata, and any diagnostic sections -- the three things that
      # make an importer raise and answer 500 with no detail.
      python3 - "$SCAN_FILE" <<'SHAPE'
      import json, sys
      KNOWN = {"CRITICAL", "ERROR", "HIGH", "WARNING", "MEDIUM", "LOW", "INFO"}
      try:
          report = json.load(open(sys.argv[1], encoding="utf-8"))
      except (OSError, ValueError) as exc:
          print(f"  could not read report: {exc}")
          sys.exit(0)
      results = report.get("results") or []
      print(f"  findings: {len(results)}")
      sev = sorted({(i.get("extra") or {}).get("severity") for i in results if (i.get("extra") or {}).get("severity")})
      print(f"  severities: {', '.join(sev) if sev else 'none'}")
      unknown = [s for s in sev if s.upper() not in KNOWN]
      if unknown:
          print(f"  UNKNOWN severities (may fail the import): {', '.join(unknown)}")
      missing = [i.get("check_id", "?") for i in results if not (i.get("extra") or {}).get("metadata")]
      print(f"  findings without extra.metadata: {len(missing)}")
      for check_id in missing[:5]:
          print(f"   - {check_id}")
      if missing:
          print("  a parser that indexes extra.metadata directly will raise on these")
      extra = [k for k in report if k not in ("version", "results", "errors", "paths")]
      if extra:
          print(f"  diagnostic sections present: {', '.join(extra)}")
          print("  set SLIM_REPORT=true to drop them if the importer rejects the file")
      SHAPE
      # Semgrep emits diagnostic sections (time, engine_requested, skipped
      # rules) alongside results. They are large and some importers choke on
      # them. Keeping only the fields a parser needs is opt-in, because
      # dropping data should be a deliberate choice, not a silent default.
      if [ "${SLIM_REPORT:-false}" = "true" ]; then
        python3 -c "import json,sys; p=sys.argv[1]; d=json.load(open(p)); json.dump({k:d.get(k) for k in ('version','results','errors','paths')}, open(p,'w'))" "$SCAN_FILE"
        echo "slimmed report to $(wc -c <"$SCAN_FILE") bytes"
      fi
    displayName: "Semgrep: scan repository"
    env:
      SCAN_FILE: "$(Build.SourcesDirectory)/semgrep.json"
      SEMGREP_RULES: "auto"
      # Scan the whole checkout by default; set to a subdirectory for a
      # monorepo (e.g. "src/MyService").
      SCAN_PATH: "."
      # Set to "true" if the importer rejects the full report (e.g. HTTP 500):
      # it keeps only version/results/errors/paths.
      SLIM_REPORT: "false"

  - script: |
      set -euo pipefail
      # A missing scan file is not an error, but it MUST NOT look like a
      # successful upload: say so loudly, because a green step with no upload
      # is the easiest way to believe results are being published when they
      # are not.
      if [ ! -f "$SCAN_FILE" ]; then
        echo "NOT UPLOADED: no scan file at $SCAN_FILE"
        echo "Point SCAN_FILE at the report your scanner produces."
        exit 0
      fi
      echo "uploading $(wc -c <"$SCAN_FILE") bytes from $SCAN_FILE"
      # scan_type is required and is an ENUM, not the human-readable parser
      # name: sending the display name ("Semgrep JSON Report") makes the
      # parser lookup miss. Rather than hard-code a guess, ask the API which
      # parsers it supports and pick the semgrep one. If that fails, fall back
      # to SCAN_TYPE so a changed listing never blocks the upload.
      # `set -euo pipefail` + a failing getent kills the step with NO message
      # at all: the overlay name not resolving is by far the most likely
      # runtime failure here, and it was the one failure that said nothing.
      # Measured: with the tunnel up but the name unresolved, the step exited
      # silently right here. `|| true` keeps the pipeline alive so the cause
      # can be reported instead of guessed.
      ip="$(getent hosts "$ZITI_INTERCEPT_DNS" 2>/dev/null | awk '{print $1}' | head -1 || true)"
      if [ -z "$ip" ]; then
        echo "OVERLAY NAME DID NOT RESOLVE: $ZITI_INTERCEPT_DNS"
        echo "The tunneller is not intercepting this name. Either the identity"
        echo "has no access to the service, or the tunneller is not running."
        echo "Without it, --resolve would be malformed and curl would reach"
        echo "the wrong host (or nothing)."
        exit 1
      fi
      discovered="$(curl -s --resolve "${SECOPS_HOST}:${SECOPS_PORT}:${ip}" \
        -H "Authorization: Bearer ${OPENSECOPS_API_KEY}" \
        "https://${SECOPS_HOST}:${SECOPS_PORT}/api/imports/parsers" \
        | tr ',' '\n' | grep -oiE '"[A-Za-z0-9_]*SEMGREP[A-Za-z0-9_]*"' \
        | tr -d '"' | head -1 || true)"
      scan_type="${discovered:-$SCAN_TYPE}"
      [ -n "$discovered" ] && echo "scan_type discovered from API: $scan_type" \
                           || echo "scan_type from SCAN_TYPE variable: $scan_type"
      # --resolve keeps the real hostname on TLS SNI and the Host header while
      # the connection itself goes over the overlay.
      # `set -euo pipefail` + a failing getent kills the step with NO message
      # at all: the overlay name not resolving is by far the most likely
      # runtime failure here, and it was the one failure that said nothing.
      # Measured: with the tunnel up but the name unresolved, the step exited
      # silently right here. `|| true` keeps the pipeline alive so the cause
      # can be reported instead of guessed.
      ip="$(getent hosts "$ZITI_INTERCEPT_DNS" 2>/dev/null | awk '{print $1}' | head -1 || true)"
      if [ -z "$ip" ]; then
        echo "OVERLAY NAME DID NOT RESOLVE: $ZITI_INTERCEPT_DNS"
        echo "The tunneller is not intercepting this name. Either the identity"
        echo "has no access to the service, or the tunneller is not running."
        echo "Without it, --resolve would be malformed and curl would reach"
        echo "the wrong host (or nothing)."
        exit 1
      fi
      # Capture body and status separately: -sSf alone hides the response, so
      # an API that answers 200 while rejecting the payload would pass silently.
      # Bearer, confirmed by a real upload against the running API. Probing
      # without a valid key could not settle this -- "Token X", "Bearer X",
      # "ApiKey X" and X-Api-Key all answer the same 401 -- so the scheme was
      # only established once a working key was used.
      out="$(mktemp)"
      code="$(curl -s -o "$out" -w '%{http_code}' \
        --resolve "${SECOPS_HOST}:${SECOPS_PORT}:${ip}" \
        -H "Authorization: Bearer ${OPENSECOPS_API_KEY}" \
        -F "product_id=${SECOPS_PRODUCT_ID}" \
        -F "scan_type=${scan_type}" \
        -F "file=@${SCAN_FILE}" \
        "https://${SECOPS_HOST}:${SECOPS_PORT}/api/imports/upload")"
      echo "HTTP $code"
      cat "$out"; echo
      case "$code" in
        2*)
          echo "UPLOADED: product ${SECOPS_PRODUCT_ID}"
          # A 2xx only means the file was ACCEPTED, not that it was parsed.
          # A parser-lookup bug once made every upload report "completed" with
          # findings_count 0 -- green pipelines, no findings, nobody noticed.
          # Surface the count so a silent regression is visible, and let the
          # build fail on it only if the caller opts in.
          found="$(grep -o '"findings_count"[[:space:]]*:[[:space:]]*[0-9]*' "$out" \
                   | grep -o '[0-9]*$' | head -1)"
          if [ -n "$found" ]; then
            echo "findings parsed: $found"
            # Only checking for 0 was too weak: a parser that DROPS findings
            # (12 sent, 1 stored) is silent, and "some findings arrived" reads
            # as success. So count what we SENT and compare. Reporting fewer
            # findings than the scanner produced is a security-relevant lie,
            # so it is always loud; failing the build stays opt-in.
            sent="$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(len(d.get('results',[])))" \
                    "$SCAN_FILE" 2>/dev/null || true)"
            if [ -n "$sent" ]; then
              echo "findings sent: $sent"
              if [ "$sent" != "$found" ]; then
                echo "MISMATCH: sent $sent findings, the API stored $found."
                echo "The upload was accepted but the report was not fully"
                echo "parsed. Do NOT read this as a clean scan. Check that"
                echo "scan_type matches the format the scanner produced."
                # Written as if/fi, NOT `[ ... ] && exit 1`: under `set -e` a
                # trailing false test can end the step with a nonzero status
                # and no message, which is exactly the silent class this
                # pipeline keeps getting bitten by.
                if [ "${FAIL_ON_FINDINGS_MISMATCH:-false}" = "true" ]; then
                  exit 1
                fi
              fi
            fi
            if [ "$found" = "0" ] && [ "${FAIL_ON_ZERO_FINDINGS:-false}" = "true" ]; then
              echo "NOT ACCEPTED: report parsed to 0 findings."
              echo "Either the scan really is clean, or the report format is"
              echo "not recognised by the importer. Verify before trusting it."
              exit 1
            fi
          fi
          ;;
        401|403) echo "NOT UPLOADED: rejected ($code)."
                 echo "The key is missing, wrong, or lacks scope for this"
                 echo "product. Generate one under Settings > API Keys."; exit 1 ;;
        5*) echo "NOT UPLOADED: the server failed while processing ($code)."
            echo "This is a SERVER-side exception, not a bad request: the"
            echo "upload was accepted and then something threw. The response"
            echo "body above is all the API discloses; the traceback is in the"
            echo "OpenSecOps API logs. Include the file that triggered it:"
            echo "  scan_type=$scan_type, $(wc -c <"$SCAN_FILE") bytes,"
            echo "  top-level keys: $(python3 -c "import json,sys; print(','.join(json.load(open(sys.argv[1])).keys()))" "$SCAN_FILE" 2>/dev/null)"
            exit 1 ;;
        422) echo "NOT UPLOADED: the API rejected the form fields ($code)."
             echo "See the body above for the missing/invalid field. If it is"
             echo "scan_type, set SCAN_TYPE to a value from /api/imports/parsers"
             echo "-- it is an enum, not the display name."; exit 1 ;;
        *) echo "NOT UPLOADED: HTTP $code"; exit 1 ;;
      esac
    displayName: "OpenSecOps: upload scan results over the overlay"
    env:
      SCAN_FILE: "$(Build.SourcesDirectory)/semgrep.json"
      # Set to "true" once you expect findings, so a report that silently
      # parses to nothing fails the build instead of passing quietly.
      FAIL_ON_ZERO_FINDINGS: "false"
      # Fallback only: the enum is normally discovered from /api/imports/parsers.
      SCAN_TYPE: "semgrep"
      SECOPS_PRODUCT_ID: "$(SECOPS_PRODUCT_ID)"
      OPENSECOPS_API_KEY: $(OPENSECOPS_API_KEY)   # SECRET, from the variable group

  # ---------------------------------------------------------------------
  # SBOM. Semgrep reads OUR code; it says nothing about the dependencies we
  # ship, which is where most CVEs actually live. OpenSecOps grew a
  # /api/imports/sbom endpoint, so the pipeline can now send a component
  # inventory as well as findings.
  #
  # Measured against the live API over the overlay before writing this:
  #   /api/imports/sbom     -> 405 to GET  (exists, POST-only)
  #   /api/imports/archive  -> 404         (does NOT exist; not wired up)
  # Guessing at the second one would have produced a step that always 404s
  # and, with `|| true`, always looked fine.
  # ---------------------------------------------------------------------
  - script: |
      set -euo pipefail
      if [ "${UPLOAD_SBOM:-false}" != "true" ]; then
        echo "SBOM upload disabled (set UPLOAD_SBOM=true to enable)"
        exit 0
      fi

      # syft is pinned. `latest` on a security tool is a silent supply-chain
      # dependency for the thing that inventories our supply chain.
      syft_version="${SYFT_VERSION:-1.18.1}"
      if ! command -v syft >/dev/null 2>&1; then
        # Measured: with `set -euo pipefail`, a failed download kills the step
        # with NO message -- the reader sees only a numeric exit code and has
        # to guess. This is the same silent death that hid the unresolved
        # overlay name, two lines below, so it gets the same treatment.
        if ! curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
             | sh -s -- -b "$(Agent.TempDirectory)/bin" "v${syft_version}" >/dev/null; then
          echo "SYFT NOT INSTALLED: could not download the installer or run it."
          echo "The build agent needs egress to raw.githubusercontent.com and"
          echo "github.com, or pre-install syft v${syft_version} on the image."
          echo "Nothing was inventoried, so NO SBOM was uploaded."
          exit 1
        fi
        export PATH="$(Agent.TempDirectory)/bin:$PATH"
      fi
      if ! command -v syft >/dev/null 2>&1; then
        echo "SYFT NOT INSTALLED: the installer reported success but syft is"
        echo "not on PATH. Expected it under $(Agent.TempDirectory)/bin."
        exit 1
      fi
      syft --version

      # CycloneDX JSON: the format the endpoint documents.
      syft scan "dir:${SCAN_PATH:-.}" -o cyclonedx-json="$SBOM_FILE" -q
      [ -s "$SBOM_FILE" ] || { echo "syft produced no SBOM"; exit 1; }

      # An SBOM with zero components is the same trap as a scan of zero files:
      # it uploads cleanly and reports nothing. A repo that genuinely has no
      # dependencies is possible, so this is loud by default and fatal only on
      # request.
      comps="$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(len(d.get('components') or []))" "$SBOM_FILE")"
      echo "components inventoried: $comps"
      if [ "$comps" -eq 0 ]; then
        echo "WARNING: the SBOM lists no components. Either this repo has no"
        echo "dependencies, or syft did not recognise the manifests under"
        echo "${SCAN_PATH:-.} -- in which case nothing is being monitored."
        if [ "${FAIL_ON_EMPTY_SBOM:-false}" = "true" ]; then exit 1; fi
      fi

      # `set -euo pipefail` + a failing getent kills the step with NO message
      # at all: the overlay name not resolving is by far the most likely
      # runtime failure here, and it was the one failure that said nothing.
      # Measured: with the tunnel up but the name unresolved, the step exited
      # silently right here. `|| true` keeps the pipeline alive so the cause
      # can be reported instead of guessed.
      ip="$(getent hosts "$ZITI_INTERCEPT_DNS" 2>/dev/null | awk '{print $1}' | head -1 || true)"
      if [ -z "$ip" ]; then
        echo "OVERLAY NAME DID NOT RESOLVE: $ZITI_INTERCEPT_DNS"
        echo "The tunneller is not intercepting this name. Either the identity"
        echo "has no access to the service, or the tunneller is not running."
        echo "Without it, --resolve would be malformed and curl would reach"
        echo "the wrong host (or nothing)."
        exit 1
      fi
      out="$(mktemp)"
      code="$(curl -s -o "$out" -w '%{http_code}' \
        --resolve "${SECOPS_HOST}:${SECOPS_PORT}:${ip}" \
        -H "Authorization: Bearer ${OPENSECOPS_API_KEY}" \
        -F "product_id=${SECOPS_PRODUCT_ID}" \
        -F "file=@${SBOM_FILE}" \
        "https://${SECOPS_HOST}:${SECOPS_PORT}/api/imports/sbom")"
      echo "HTTP $code"
      cat "$out"; echo

      case "$code" in
        2*)
          # Same lesson as the findings upload: 2xx means ACCEPTED, not
          # ingested. Compare what we sent with what was stored, so a
          # component inventory that quietly shrinks is visible.
          stored="$(grep -o '"component[s_]*count"[[:space:]]*:[[:space:]]*[0-9]*' "$out" \
                    | grep -o '[0-9]*$' | head -1)"
          if [ -n "$stored" ]; then
            echo "components sent: $comps, stored: $stored"
            if [ "$comps" != "$stored" ]; then
              echo "MISMATCH: sent $comps components, the API stored $stored."
              echo "Components are being dropped; the inventory understates"
              echo "what we actually ship."
              if [ "${FAIL_ON_SBOM_MISMATCH:-false}" = "true" ]; then exit 1; fi
            fi
          else
            echo "NOTE: the response carries no component count, so what was"
            echo "stored could not be verified from here."
          fi
          echo "SBOM UPLOADED: product ${SECOPS_PRODUCT_ID}" ;;
        401|403) echo "SBOM NOT UPLOADED: rejected ($code). The key is missing,"
                 echo "wrong, or lacks scope for this product."; exit 1 ;;
        404) echo "SBOM NOT UPLOADED: the endpoint is gone ($code)."
             echo "/api/imports/sbom answered 405 to GET when this step was"
             echo "written, i.e. it existed. A 404 now means the API changed."
             exit 1 ;;
        422) echo "SBOM NOT UPLOADED: the API rejected the form fields ($code)."
             echo "See the body above for the missing/invalid field."; exit 1 ;;
        5*) echo "SBOM NOT UPLOADED: the server failed while processing ($code)."
            echo "  $(wc -c <"$SBOM_FILE") bytes, $comps components"; exit 1 ;;
        *) echo "SBOM NOT UPLOADED: HTTP $code"; exit 1 ;;
      esac
    displayName: "OpenSecOps: upload SBOM over the overlay"
    env:
      SBOM_FILE: "$(Build.SourcesDirectory)/sbom.cyclonedx.json"
      # Off by default: turning it on without a working key would make every
      # build red for a feature nobody asked for yet.
      UPLOAD_SBOM: "false"
      SCAN_PATH: "."
      SECOPS_PRODUCT_ID: "$(SECOPS_PRODUCT_ID)"
      OPENSECOPS_API_KEY: $(OPENSECOPS_API_KEY)   # SECRET, from the variable group
