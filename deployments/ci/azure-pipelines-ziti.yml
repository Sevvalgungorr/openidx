# Azure DevOps: reach OpenSecOps over the Ziti overlay.
#
# The CI agent is a Microsoft-hosted Ubuntu VM on the public internet. It has no
# route to the internal network and no inbound port is opened for it. Instead the
# agent runs a Ziti tunneller, authenticates with its own enrolled identity and
# dials the service over the overlay.
#
# WHAT MUST EXIST BEFORE THIS RUNS (deployments/ci/setup-ci-overlay-access.sh):
#   - a dialable service carrying an intercept.v1 config (a host.v1-only service
#     is reachable by BrowZer but gives a tunneller no address to intercept)
#   - a Dial policy binding the CI identity role to that service
#   - an edge-router policy and a service-edge-router policy, otherwise the
#     identity authenticates fine and then simply cannot see the service
#   - an enrolled CI identity uploaded as a Secure File (it is ~8 KB, so it
#     cannot be a pipeline variable: those are capped at 4096 characters)
#
# The tunneller and the controller are DIFFERENT PROJECTS with independent
# version lines (ziti-tunnel-sdk-c vs openziti/ziti). Pinning the tunneller to
# the controller's version is a guaranteed break: v1.1.15 does not exist and
# the download 404s.

variables:
  # A variable group is referenced with LIST syntax. Mixing the mapping form
  # (KEY: value) with a group in the same block is a schema error, so once a
  # group is used every entry must be a list item.
  #
  # Create the group in Pipelines > Library and authorise this pipeline to use
  # it. The group holds SHORT secrets and values SHARED across pipelines;
  # per-run values belong below, and the Ziti identity is a Secure File
  # because it exceeds the variable size limit.
  - group: ZitiCIVars

  # Tunneller release (github.com/openziti/ziti-tunnel-sdk-c). NOT the controller version.
  - name: ZITI_TUNNELER_VERSION
    value: "1.18.3"
  # Overlay DNS name and port. Asserted against the controller at run time
  # (step 3) rather than trusted: a stale value here fails as a confusing DNS
  # timeout instead of a clear error.
  - name: ZITI_INTERCEPT_DNS
    value: "secops.ziti"
  - name: SECOPS_PORT
    value: "443"
  # The app selects its certificate and routes by hostname, so TLS/Host must
  # carry its real name even though we connect via the overlay name.
  - name: SECOPS_HOST
    value: "secops.tdv.org"
  # Per-RUN values (e.g. $(Build.Repository.Name)) belong HERE, not in a
  # variable group: groups are static and shared, and a $(...) macro stored
  # inside one is not guaranteed to expand -- it can arrive empty or as the
  # literal text.

steps:
  - script: |
      set -euo pipefail
      url="https://github.com/openziti/ziti-tunnel-sdk-c/releases/download/v${ZITI_TUNNELER_VERSION}/ziti-edge-tunnel-Linux_x86_64.zip"
      # Fail on the download itself rather than on a later confusing unzip error.
      curl -sSLf "$url" -o zet.zip
      sudo apt-get update -y >/dev/null && sudo apt-get install -y unzip >/dev/null
      unzip -o zet.zip -d /tmp/zet >/dev/null
      sudo install /tmp/zet/ziti-edge-tunnel /usr/local/bin/ziti-edge-tunnel
      ziti-edge-tunnel version
    displayName: "Ziti: install tunneller"

  # The enrolled identity is ~8 KB, and an Azure pipeline VARIABLE is capped at
  # 4096 characters -- base64 of it is 10908, so it cannot be a variable at all.
  # Compressing does not help either (gzip+base64 is still 5524). Secure Files
  # has no such limit and is Microsoft's own recommendation for exactly this.
  #
  # Authorise the pipeline once: Pipelines > Library > Secure files >
  # ci-identity.json > Pipeline permissions.
  - task: DownloadSecureFile@1
    name: zitiIdentity
    displayName: "Ziti: fetch identity (secure file)"
    inputs:
      secureFile: ci-identity.json

  - script: |
      set -euo pipefail
      # Use the downloaded file WHERE IT IS. DownloadSecureFile already places
      # it under Agent.TempDirectory, so copying it to a path built from that
      # same directory makes source and destination identical and cp fails
      # with "are the same file". Referencing the task output directly also
      # keeps working if Azure changes the location.
      id="$(zitiIdentity.secureFilePath)"
      if [ -z "${id:-}" ] || [ ! -s "$id" ]; then
        echo "Secure file 'ci-identity.json' was not downloaded."
        echo "Upload it under Pipelines > Library > Secure files and grant this"
        echo "pipeline permission. See docs/ci-over-ziti-overlay.md section 5."
        exit 1
      fi
      chmod 600 "$id" 2>/dev/null || true
      # An enrolled identity is JSON carrying the controller address (ztAPI);
      # a JWT is three dot-separated segments. Confusing the two is the most
      # common mistake and would otherwise surface as a TLS error much later.
      if ! grep -q '"ztAPI"' "$id"; then
        echo "The secure file is not an enrolled identity (no ztAPI field)."
        echo "Did you store the JWT instead? Enrol it first:"
        echo "  ziti-edge-tunnel enroll --jwt <file>.jwt --identity <file>.json"
        exit 1
      fi
      # 'run' needs root: it creates a TUN device and installs a resolver so the
      # overlay DNS name resolves for ordinary tools like curl.
      sudo nohup ziti-edge-tunnel run --identity "$id" \
        > "$(Agent.TempDirectory)/ziti.log" 2>&1 &
      echo "waiting for overlay DNS ${ZITI_INTERCEPT_DNS} ..."
      for _ in $(seq 1 30); do
        getent hosts "$ZITI_INTERCEPT_DNS" >/dev/null 2>&1 && break
        sleep 2
      done
      if ! getent hosts "$ZITI_INTERCEPT_DNS" >/dev/null 2>&1; then
        echo "overlay did not come up; tunneller log follows:"
        cat "$(Agent.TempDirectory)/ziti.log"
        exit 1
      fi
      getent hosts "$ZITI_INTERCEPT_DNS"
    displayName: "Ziti: connect overlay"

  - script: |
      set -euo pipefail
      # Proof the overlay carried the request, not just that something answered.
      # --resolve pins the app's hostname to the overlay IP, so TLS SNI and the
      # Host header carry the real name while the connection still goes through
      # the tunneller. Without this the origin answers 404 (wrong Host) or the
      # handshake fails outright, which looks like a broken service.
      ip="$(getent hosts "$ZITI_INTERCEPT_DNS" | awk '{print $1}' | head -1)"
      echo "overlay address for ${ZITI_INTERCEPT_DNS}: ${ip}"
      body="$(curl -sSf --resolve "${SECOPS_HOST}:${SECOPS_PORT}:${ip}" \
                "https://${SECOPS_HOST}:${SECOPS_PORT}/health")"
      echo "$body"
      # A 200 alone is not proof: a captive portal or a proxy also returns 200.
      echo "$body" | grep -q '"status":"ok"' \
        || { echo "unexpected health payload"; exit 1; }
      # /health is served by the frontend, so it proves the host is reachable
      # but NOT that the API behind it is routed. Probe a real API path too.
      # 401 is the expected answer without credentials and is a PASS here: it
      # means the route exists and authentication is enforced. Note that /api
      # itself 404s -- only concrete sub-paths are published, so probing the
      # root and concluding "there is no API" is wrong (I made exactly that
      # mistake).
      code="$(curl -s -o /dev/null -w '%{http_code}' \
        --resolve "${SECOPS_HOST}:${SECOPS_PORT}:${ip}" \
        "https://${SECOPS_HOST}:${SECOPS_PORT}/api/imports/parsers")"
      case "$code" in
        200|401|403) echo "API routed (/api/imports/parsers -> $code)" ;;
        *) echo "API not routed (/api/imports/parsers -> $code)"; exit 1 ;;
      esac
      echo "reachable over the overlay"
    displayName: "OpenSecOps: connectivity check"

  # Produce the report the upload step publishes. Semgrep is used here because
  # OpenSecOps ships a "Semgrep JSON Report" parser, so this is `--json`, NOT
  # SARIF: the importer keys parsers by format and a mismatched file imports as
  # zero findings while still reporting success.
  #
  # RULESET MATTERS, measured on a file with a real subprocess(shell=True) bug:
  #   p/ci      -> 0 findings   (and errors: [] -- it looks like a clean scan)
  #   p/default -> 1
  #   p/python  -> 1
  #   auto      -> 1
  # So `auto` is the default here. A narrow ruleset that silently finds nothing
  # is indistinguishable from secure code, which is the failure mode this whole
  # pipeline is written to avoid.
  - script: |
      set -euo pipefail
      python3 -m pip install --quiet --user semgrep
      export PATH="$HOME/.local/bin:$PATH"
      semgrep --version
      # --error would fail the build on findings; we want them PUBLISHED, so
      # the scan itself must succeed even when it finds problems.
      semgrep scan --config="$SEMGREP_RULES" --json --quiet \
        -o "$SCAN_FILE" . || true
      [ -s "$SCAN_FILE" ] || { echo "semgrep produced no report"; exit 1; }
      count="$(python3 -c "import json,sys; print(len(json.load(open(sys.argv[1]))['results']))" "$SCAN_FILE")"
      echo "semgrep findings: $count"
    displayName: "Semgrep: scan repository"
    env:
      SCAN_FILE: "$(Build.SourcesDirectory)/semgrep.json"
      SEMGREP_RULES: "auto"

  - script: |
      set -euo pipefail
      # A missing scan file is not an error, but it MUST NOT look like a
      # successful upload: say so loudly, because a green step with no upload
      # is the easiest way to believe results are being published when they
      # are not.
      if [ ! -f "$SCAN_FILE" ]; then
        echo "NOT UPLOADED: no scan file at $SCAN_FILE"
        echo "Point SCAN_FILE at the report your scanner produces."
        exit 0
      fi
      echo "uploading $(wc -c <"$SCAN_FILE") bytes from $SCAN_FILE"
      # scan_type is required and is an ENUM, not the human-readable parser
      # name: sending the display name ("Semgrep JSON Report") makes the
      # parser lookup miss. Rather than hard-code a guess, ask the API which
      # parsers it supports and pick the semgrep one. If that fails, fall back
      # to SCAN_TYPE so a changed listing never blocks the upload.
      ip="$(getent hosts "$ZITI_INTERCEPT_DNS" | awk '{print $1}' | head -1)"
      discovered="$(curl -s --resolve "${SECOPS_HOST}:${SECOPS_PORT}:${ip}" \
        -H "Authorization: Bearer ${OPENSECOPS_API_KEY}" \
        "https://${SECOPS_HOST}:${SECOPS_PORT}/api/imports/parsers" \
        | tr ',' '\n' | grep -oiE '"[A-Za-z0-9_]*SEMGREP[A-Za-z0-9_]*"' \
        | tr -d '"' | head -1 || true)"
      scan_type="${discovered:-$SCAN_TYPE}"
      [ -n "$discovered" ] && echo "scan_type discovered from API: $scan_type" \
                           || echo "scan_type from SCAN_TYPE variable: $scan_type"
      # --resolve keeps the real hostname on TLS SNI and the Host header while
      # the connection itself goes over the overlay.
      ip="$(getent hosts "$ZITI_INTERCEPT_DNS" | awk '{print $1}' | head -1)"
      # Capture body and status separately: -sSf alone hides the response, so
      # an API that answers 200 while rejecting the payload would pass silently.
      # Bearer, confirmed by a real upload against the running API. Probing
      # without a valid key could not settle this -- "Token X", "Bearer X",
      # "ApiKey X" and X-Api-Key all answer the same 401 -- so the scheme was
      # only established once a working key was used.
      out="$(mktemp)"
      code="$(curl -s -o "$out" -w '%{http_code}' \
        --resolve "${SECOPS_HOST}:${SECOPS_PORT}:${ip}" \
        -H "Authorization: Bearer ${OPENSECOPS_API_KEY}" \
        -F "product_id=${SECOPS_PRODUCT_ID}" \
        -F "scan_type=${scan_type}" \
        -F "file=@${SCAN_FILE}" \
        "https://${SECOPS_HOST}:${SECOPS_PORT}/api/imports/upload")"
      echo "HTTP $code"
      cat "$out"; echo
      case "$code" in
        2*)
          echo "UPLOADED: product ${SECOPS_PRODUCT_ID}"
          # A 2xx only means the file was ACCEPTED, not that it was parsed.
          # A parser-lookup bug once made every upload report "completed" with
          # findings_count 0 -- green pipelines, no findings, nobody noticed.
          # Surface the count so a silent regression is visible, and let the
          # build fail on it only if the caller opts in.
          found="$(grep -o '"findings_count"[[:space:]]*:[[:space:]]*[0-9]*' "$out" \
                   | grep -o '[0-9]*$' | head -1)"
          if [ -n "$found" ]; then
            echo "findings parsed: $found"
            if [ "$found" = "0" ] && [ "${FAIL_ON_ZERO_FINDINGS:-false}" = "true" ]; then
              echo "NOT ACCEPTED: report parsed to 0 findings."
              echo "Either the scan really is clean, or the report format is"
              echo "not recognised by the importer. Verify before trusting it."
              exit 1
            fi
          fi
          ;;
        401|403) echo "NOT UPLOADED: rejected ($code)."
                 echo "The key is missing, wrong, or lacks scope for this"
                 echo "product. Generate one under Settings > API Keys."; exit 1 ;;
        422) echo "NOT UPLOADED: the API rejected the form fields ($code)."
             echo "See the body above for the missing/invalid field. If it is"
             echo "scan_type, set SCAN_TYPE to a value from /api/imports/parsers"
             echo "-- it is an enum, not the display name."; exit 1 ;;
        *) echo "NOT UPLOADED: HTTP $code"; exit 1 ;;
      esac
    displayName: "OpenSecOps: upload scan results over the overlay"
    env:
      SCAN_FILE: "$(Build.SourcesDirectory)/semgrep.json"
      # Set to "true" once you expect findings, so a report that silently
      # parses to nothing fails the build instead of passing quietly.
      FAIL_ON_ZERO_FINDINGS: "false"
      # Fallback only: the enum is normally discovered from /api/imports/parsers.
      SCAN_TYPE: "SEMGREP"
      SECOPS_PRODUCT_ID: "$(SECOPS_PRODUCT_ID)"
      OPENSECOPS_API_KEY: $(OPENSECOPS_API_KEY)   # SECRET, from the variable group
