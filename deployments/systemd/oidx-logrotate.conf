# OpenIDX service logs — rotation.
#
# Why this exists: the services write straight to files under /tmp/oidx-logs and
# nothing ever truncated them. Measured before this config: 270 MB across seven
# logs, the largest 65 MB, none rotated since the services first started.
#
# The size was not the real damage. The damage was that a log covering months
# reads as if it were current: a burst of 5276 identical errors that had stopped
# a week earlier still sat at the end of the file and looked like a live
# incident. A log you cannot date is a log you cannot trust.
#
# copytruncate is REQUIRED here, not a preference.
#   Every service holds its log file open for the lifetime of the process
#   (verified: 2 open descriptors each, via systemd StandardOutput=append: and
#   via the access-service wrapper script). systemd's append: does not reopen on
#   SIGHUP. So the usual rename-and-create rotation would leave every service
#   writing into the unlinked old inode: the new file stays empty, disk is never
#   reclaimed, and logging silently dies while looking fine.
#   copytruncate copies the file and truncates the original in place, so the
#   held descriptor keeps working.
#
# The trade-off copytruncate makes is a small window between copy and truncate
# in which a line can be lost. That is acceptable for these logs precisely
# because they are not the system of record: security-relevant events go to the
# audit_events table, not here. Losing a line of debug output is cheaper than
# losing the ability to rotate at all.

/tmp/oidx-logs/*.log {
    daily
    # 14 days is deliberate: long enough to investigate an incident reported on
    # a Monday about something that happened the previous weekend, short enough
    # that the whole directory stays well under a gigabyte compressed.
    rotate 14

    # Rotate early if a service gets chatty, so one bad day cannot fill the
    # disk before the daily timer runs.
    maxsize 100M

    compress
    # Keep the most recent rotation uncompressed: that is the one someone
    # actually greps during an incident, and zgrep on a 60 MB file is slow
    # enough to matter when you are trying to answer a question quickly.
    delaycompress

    # See the note above — this is the only safe mode for these processes.
    copytruncate

    # An empty log is not an error, and a missing one means the service simply
    # has not started yet. Neither should fail the rotation run.
    missingok
    notifempty

    # Rotated files inherit the owner; the logs can contain request paths and
    # user identifiers, so they stay readable only by their owner.
    create 0600 cmit cmit
}
